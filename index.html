        <div class="field"><label>Telefone</label><input id="c_tel" value="${escapeAttr(ct.telefone)}" placeholder="(41) 00000-0000" inputmode="tel"></div>
        ${endFieldsHtml('ce_', ct.end)}
      </div>
    </div>

    <div class="modal-actions">
      <div>${!isNew?`<button class="btn danger small" id="i_del">Excluir</button>`:''}</div>
      <div style="display:flex;gap:8px;"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="i_save">${isNew?'Cadastrar':'Salvar'}</button></div>
    </div>`, 1180);

  // máscaras
  const q = s=>overlay.querySelector(s);
  bindMask(q('#i_cnpj'), maskCNPJ, maskCNPJ);
  ['#r_cpf','#c_cpf'].forEach(s=>bindMask(q(s), maskCPF, maskCPF));
  ['#r_rg','#c_rg'].forEach(s=>bindMask(q(s), maskRG));
  ['#i_tel','#r_tel','#c_tel'].forEach(s=>bindMask(q(s), maskPhone, maskPhone));
  ['#ie_cep','#re_cep','#ce_cep'].forEach(s=>bindMask(q(s), maskCEP, maskCEP));

  overlay.querySelectorAll('.swatches button').forEach(b=>b.onclick = ()=>{
    cor = b.dataset.cor; overlay.querySelectorAll('.swatches button').forEach(x=>x.classList.toggle('active', x===b));
  });
  if(!isNew){
    q('#i_del').onclick = ()=>{
      const nTar = state.tarefas.filter(t=>t.instituicaoId===i.id).length;
      const nCert = state.certidoes.filter(x=>x.instituicaoId===i.id).length;
      const nLink = state.links.filter(l=>l.instituicaoId===i.id).length;
      if(!confirm(`Excluir "${i.nome}" e seus ${i.projetos.length} projeto(s)?\n\nTambém serão apagados: ${nCert} registro(s) de certidão e ${nLink} link(s). ${nTar} tarefa(s) ficarão sem instituição.\n\nEssa ação não pode ser desfeita.`)) return;
      state.instituicoes = state.instituicoes.filter(x=>x.id!==i.id);
      state.certidoes = state.certidoes.filter(x=>x.instituicaoId!==i.id);
      state.links = state.links.filter(l=>l.instituicaoId!==i.id);
      scheduleSave(); overlay.remove(); render(); toast('Instituição excluída.');
    };
  }
  q('#i_save').onclick = ()=>{
    const nome = q('#i_nome').value.trim();
    if(!nome){ toast('Informe o nome da instituição.'); return; }
    const emails = [['#i_email','instituição'],['#r_email','representante'],['#c_email','contador']];
    for(const [sel, quem] of emails){
      const v = q(sel).value.trim();
      if(v && !/^\S+@\S+\.\S+$/.test(v)){ toast(`O e-mail do ${quem} parece inválido.`); q(sel).focus(); return; }
    }
    const cpfs = [['#r_cpf','representante'],['#c_cpf','contador']];
    for(const [sel, quem] of cpfs){
      const d = onlyDigits(q(sel).value);
      if(d && d.length!==11){ toast(`O CPF do ${quem} precisa ter 11 dígitos.`); q(sel).focus(); return; }
    }
    const val = s=>q(s).value.trim();
    const sigla = val('#i_sigla').toUpperCase().replace(/\s+/g,' ');
    const dup = sigla && state.instituicoes.find(x=>x.id!==i.id && normalizeStr(x.sigla)===normalizeStr(sigla));
    if(dup){ toast(`A sigla ${sigla} já é usada por ${dup.nome}.`); q('#i_sigla').focus(); return; }
    Object.assign(i, {
      nome, sigla, cor,
      cnpj: maskCNPJ(val('#i_cnpj')) || val('#i_cnpj'),
      email: val('#i_email'),
      telefone: maskPhone(val('#i_tel')),
      dataInscricao: q('#i_insc').value,
      excluirIndicadores: q('#i_excl').checked,
      end: readEnd(overlay, 'ie_')
    });
    i.endereco = formatEnd(i.end); // texto único, mantido para compatibilidade e consulta
    i.rep = Object.assign(i.rep, {
      nome: val('#r_nome'), cpf: maskCPF(val('#r_cpf')), rg: maskRG(val('#r_rg')), profissao: val('#r_prof'),
      email: val('#r_email'), telefone: maskPhone(val('#r_tel')), end: readEnd(overlay, 're_')
    });
    i.contador = Object.assign(i.contador, {
      nome: val('#c_nome'), cpf: maskCPF(val('#c_cpf')), rg: maskRG(val('#c_rg')), profissao: val('#c_prof'),
      crcUf: q('#c_crcuf').value, crcNumero: val('#c_crcnum'),
      email: val('#c_email'), telefone: maskPhone(val('#c_tel')), end: readEnd(overlay, 'ce_')
    });
    if(isNew) state.instituicoes.push(i);
    scheduleSave(); overlay.remove(); render();
    toast(isNew?'Instituição cadastrada.':'Instituição atualizada.');
  };
}

/* ================== CERTIDÕES ================== */
// ---- Regras de vencimento ----
const REGRAS_NOTIF = [
  ['dia',     'Notificar somente no dia do vencimento'],
  ['diaSeguinte', 'Notificar 1 dia após o vencimento'],
  ['4meses',  'Notificar com 4 meses de antecedência'],
  ['nenhuma', 'Não gerar notificação de vencimento']
];
const CATEGORIAS_DOC = [['certidao','Certidão convencional'],['institucional','Documento institucional']];
function categoriaPadrao(nome){ return /certid/.test(normalizeStr(nome)) ? 'certidao' : 'institucional'; }
function regraLabel(id){ const r = REGRAS_NOTIF.find(x=>x[0]===id); return r ? r[1] : '—'; }
// Início da janela de alerta (aaaa-mm-dd).
// 4 meses: 1º dia do mês, 4 meses antes do vencimento (vence 30/09/2027 → alerta a partir de 01/05/2027).
// Demais regras: 30 dias antes (mesma janela que o sistema já usava nos indicadores).
function inicioAlerta(tipo, venc){
  const d = new Date(String(venc).slice(0,10)+'T00:00:00');
  if(isNaN(d)) return null;
  if(tipo.regraNotif==='4meses'){ const i = new Date(d.getFullYear(), d.getMonth()-4, 1); return `${i.getFullYear()}-${pad2(i.getMonth()+1)}-01`; }
  d.setDate(d.getDate()-30);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
// Situação de um documento numa instituição: na | semdata | vencida | alerta | ok
function certStatus(tipo, cert){
  if(cert && cert.naoAplica) return {k:'na', label:'não se aplica', cls:'na'};
  const du = cert ? daysUntil(cert.proximoVencimento) : null;
  if(du===null) return {k:'semdata', label:'sem data', cls:'none'};
  if(du===-1 && tipo.regraNotif==='diaSeguinte') return {k:'vencida', dias:du, label:'renovar hoje', cls:'bad'}; // só pode ser renovada no dia seguinte
  if(du<0) return {k:'vencida', dias:du, label:`vencida há ${Math.abs(du)}d`, cls:'bad'};
  const ini = inicioAlerta(tipo, cert.proximoVencimento);
  if(ini && todayStr() >= ini) return {k:'alerta', dias:du, label: du===0 ? 'vence hoje' : `vence em ${du}d`, cls:'warn', desde:ini};
  return {k:'ok', dias:du, label:'em dia', cls:'ok', desde:ini};
}
// Sites oficiais de emissão (mesmos já usados na Central de Links do gestor original).
const SITES_CERTIDAO = [
  [/divida ativa da uniao|receita federal|pgfn/, 'https://servicos.receitafederal.gov.br/servico/certidoes/#/home/cnpj'],
  [/divida ativa estadual|estadual/,             'https://cdwfazenda.paas.pr.gov.br/cdwportal/certidao/automatica'],
  [/fgts|crf/,                                   'https://consulta-crf.caixa.gov.br/consultacrf/pages/consultaEmpregador.jsf'],
  [/trabalhista|cndt/,                           'https://cndt-certidao.tst.jus.br/inicio.faces'],
  [/cepim/,                                      'https://certidoes.cgu.gov.br/'],
  [/tce/,                                        'https://www.tce.pr.gov.br/para-o-fiscalizado/servicos/certidoes/certidao-liberatoria/']
];
// Certidão municipal: o site depende da cidade da instituição.
const SITES_MUNICIPAIS = {
  'curitiba': 'https://cnd-cidadao.curitiba.pr.gov.br/',
  'colombo': 'https://colombo.atende.net/autoatendimento/servicos/certidao-negativa-de-debitos/detalhar/1',
  'sao jose dos pinhais': 'https://financas.sjp.pr.gov.br/socioEconomicoGateway/#/certidao'
};
function siteConhecido(nomeTipo){
  const n = normalizeStr(nomeTipo);
  const hit = SITES_CERTIDAO.find(([re])=>re.test(n));
  return hit ? hit[1] : '';
}
function isMunicipal(tipo){ return /municip/.test(normalizeStr(tipo.nome)); }
// Qual site abrir para emitir: 1) o específico da instituição; 2) o da cidade (certidão municipal); 3) o padrão do tipo.
function siteEmissao(inst, tipo, cert){
  if(cert && cert.siteEmissao) return {url:cert.siteEmissao, origem:'específico desta instituição'};
  if(isMunicipal(tipo) && inst && inst.end){
    const u = SITES_MUNICIPAIS[normalizeStr(inst.end.cidade)];
    if(u) return {url:u, origem:`prefeitura de ${inst.end.cidade}`};
  }
  if(tipo.siteEmissao) return {url:tipo.siteEmissao, origem:'padrão do tipo de certidão'};
  return null;
}
function renderCertidoes(c){
  const filterBar = document.createElement('div');
  filterBar.className='filters';
  filterBar.innerHTML = `
    <select id="instFilterCert"><option value="">Todas instituições</option>
      ${state.instituicoes.map(i=>`<option value="${i.id}" ${certInst===i.id?'selected':''}>${escapeHtml(instLabel(i))}</option>`).join('')}
    </select>
    <div class="spacer"></div>
    <button class="btn ghost small" id="importCertBtn">⇪ Importar certidões</button>`;
  c.appendChild(filterBar);
  filterBar.querySelector('#instFilterCert').onchange = e=>{ certInst=e.target.value; render(); };
  filterBar.querySelector('#importCertBtn').onclick = openImportCertModal;

  const insts = state.instituicoes.filter(i=> !certInst || i.id===certInst);
  if(insts.length===0){
    c.innerHTML += `<div class="empty-state"><div class="big">Nenhuma instituição cadastrada</div><div>Cadastre as instituições na aba "Instituições".</div></div>`;
    return;
  }
  if(state.certidaoTipos.length===0){
    c.innerHTML += `<div class="empty-state"><div class="big">Nenhum tipo de certidão</div><div>Cadastre os tipos em Configurações.</div></div>`;
    return;
  }
  insts.forEach(inst=>{
    let ok=0,warn=0,bad=0,na=0;
    state.certidaoTipos.forEach(tipo=>{
      const cert = state.certidoes.find(x=>x.instituicaoId===inst.id && x.tipoId===tipo.id);
      const k = certStatus(tipo, cert).k;
      if(k==='na') na++; else if(k==='vencida' || k==='semdata') bad++; else if(k==='alerta') warn++; else ok++;
    });
    const block = document.createElement('div');
    block.className='inst-block';
    block.innerHTML = `
      <div class="inst-head">
        <span class="inst-swatch" style="background:${inst.cor}"></span>
        <h3 title="${escapeAttr(inst.nome)}">${escapeHtml(instLabel(inst))}</h3>
        ${inst.cnpj?`<button class="icon-btn cpCnpj mono small" title="Copiar CNPJ">📋 ${escapeHtml(inst.cnpj)}</button>`:''}
        <div class="stats">
          ${ok?`<span style="color:var(--ok)">${ok} em dia</span>`:''}
          ${warn?`<span style="color:var(--warn)">${warn} vencendo</span>`:''}
          ${bad?`<span style="color:var(--bad)">${bad} vencidas/sem data</span>`:''}
          ${na?`<span style="color:var(--muted)">${na} não se aplica${na>1?'m':''}</span>`:''}
        </div>
      </div>`;
    const cp = block.querySelector('.cpCnpj');
    if(cp) cp.onclick = ()=>copyText(inst.cnpj, `CNPJ de ${instLabel(inst)} copiado!`);
    const grid = document.createElement('div');
    grid.className='cert-grid';
    state.certidaoTipos.forEach(tipo=>{
      const cert = state.certidoes.find(x=>x.instituicaoId===inst.id && x.tipoId===tipo.id);
      const st = certStatus(tipo, cert);
      const bc = st.cls, bt = st.label;
      const site = st.k==='na' ? null : siteEmissao(inst, tipo, cert);
      const cell = document.createElement('div');
      cell.className='cert-cell' + (st.k==='na' ? ' na' : '');
      cell.innerHTML = `
        <div class="cn">${escapeHtml(tipo.nome)}</div>
        ${tipo.regraNotif==='4meses' ? '<div class="regra-tag">⏰ aviso 4 meses antes</div>' : tipo.regraNotif==='diaSeguinte' ? '<div class="regra-tag">⏭ aviso 1 dia após o vencimento</div>' : tipo.regraNotif==='nenhuma' ? '<div class="regra-tag">🔕 sem aviso</div>' : ''}
        <div class="cd"><span>Últ. renovação</span><span>${cert?fmtDate(cert.ultimaRenovacao):'—'}</span></div>
        <div class="cd"><span>Próx. vencimento</span><span>${cert?fmtDate(cert.proximoVencimento):'—'}</span></div>
        <div class="foot"><span class="badge ${bc}">${bt}</span>
          <span style="display:flex;gap:4px;">
          ${site ? `<a class="file-link" href="${escapeAttr(site.url)}" target="_blank" rel="noopener noreferrer" title="Abrir o site de emissão (${escapeAttr(site.origem)})">🌐 emitir</a>` : ''}
          ${cert && cert.link ? `<a class="file-link" href="${escapeAttr(cert.link)}" target="_blank" rel="noopener noreferrer" title="Abrir o arquivo da certidão">📄 abrir</a>` : ''}
          </span></div>`;
      cell.querySelectorAll('a').forEach(a=>a.onclick = e=>e.stopPropagation());
      cell.onclick = ()=>openCertModal(inst.id, tipo.id);
      grid.appendChild(cell);
    });
    block.appendChild(grid);
    c.appendChild(block);
  });
}

function openNovoTipoDocModal(){
  const overlay = makeModal('Novo tipo de certidão / documento', `
    <div class="field"><label>Nome</label><input id="nt_nome" placeholder="Ex.: Certidão de Regularidade ou Registro no CMDCA"></div>
    <div class="field"><label>Categoria</label><select id="nt_cat">${CATEGORIAS_DOC.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="field"><label>Regra de notificação de vencimento</label><select id="nt_regra"><option value="">— Selecione —</option>${REGRAS_NOTIF.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select></div>
    <div class="field"><label>Site de emissão — opcional</label><input id="nt_site" placeholder="https://..."></div>
    <div class="modal-actions" style="justify-content:flex-end;"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="nt_save">Adicionar</button></div>`, 440);
  const q = s=>overlay.querySelector(s);
  q('#nt_nome').focus();
  q('#nt_nome').oninput = e=>{ // sugere categoria e regra pelo nome; a pessoa pode trocar
    const cat = categoriaPadrao(e.target.value);
    q('#nt_cat').value = cat;
    if(!q('#nt_regra').dataset.touched) q('#nt_regra').value = cat==='certidao' ? 'dia' : '4meses';
  };
  q('#nt_regra').onchange = e=>{ e.target.dataset.touched = '1'; };
  q('#nt_save').onclick = ()=>{
    const nome = q('#nt_nome').value.trim().replace(/\s+/g,' ');
    const regra = q('#nt_regra').value, site = q('#nt_site').value.trim();
    if(!nome){ toast('Informe o nome.'); return; }
    if(!regra){ toast('Selecione a regra de notificação.'); return; }
    if(state.certidaoTipos.some(t=>normalizeStr(t.nome)===normalizeStr(nome))){ toast('Já existe um tipo com esse nome.'); return; }
    if(site && !isUrl(site)){ toast('O site precisa começar com http:// ou https://'); return; }
    state.certidaoTipos.push({id:uid(), nome, notificarApenasNoDia:false, siteEmissao: site || siteConhecido(nome), categoria: q('#nt_cat').value, regraNotif: regra});
    scheduleSave(); overlay.remove(); render(); toast('Tipo adicionado.');
  };
}

function openCertModal(instId, tipoId){
  let cert = state.certidoes.find(x=>x.instituicaoId===instId && x.tipoId===tipoId);
  const isNew = !cert;
  if(isNew) cert = {id:uid(), instituicaoId:instId, tipoId, ultimaRenovacao:'', proximoVencimento:'', link:'', siteEmissao:''};
  const inst = instById(instId);
  const tipo = state.certidaoTipos.find(t=>t.id===tipoId);
  if(!inst || !tipo) return;
  const site = siteEmissao(inst, tipo, cert);
  const padrao = siteEmissao(inst, tipo, null); // o que vale se não houver site específico
  const st0 = certStatus(tipo, cert);
  const status = `<span class="badge ${st0.cls}">${st0.label}</span>`;
  const respId = tipo.categoria==='institucional' ? state.notifInstitucionalMembroId : state.notifCertidaoMembroId;
  const resp = respId ? membroById(respId) : null;
  const iniTxt = cert.proximoVencimento && tipo.regraNotif==='4meses' ? ` — alerta a partir de ${fmtDate(inicioAlerta(tipo, cert.proximoVencimento))}` : '';

  const overlay = makeModal(escapeHtml(tipo.nome), `
    <div class="hint" style="margin:-8px 0 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <span>${escapeHtml(inst.nome)}${inst.sigla?` (${escapeHtml(inst.sigla)})`:''}</span>
      ${inst.cnpj?`<button type="button" class="icon-btn mono small" id="c_cnpj" title="Copiar CNPJ">📋 ${escapeHtml(inst.cnpj)}</button>`:''}
      ${status}
    </div>
    <div class="hint" style="margin:-6px 0 0;">
      ${tipo.categoria==='institucional'?'🏛 Documento institucional':'📄 Certidão convencional'} · ${escapeHtml(regraLabel(tipo.regraNotif))}${iniTxt}
      ${tipo.regraNotif!=='nenhuma' ? ` · aviso para: <b>${resp?escapeHtml(resp.nome):'ninguém definido (Configurações)'}</b>` : ''}
    </div>
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px;background:var(--white);cursor:pointer;">
      <input type="checkbox" id="c_na" ${cert.naoAplica?'checked':''} style="width:auto;">
      <span><b>Não se aplica a esta instituição</b><br><span class="muted small">Não gera aviso, não conta como vencido nem pendente e fica fora dos indicadores. As datas registradas são mantidas.</span></span>
    </label>

    <div class="modal-sub">1. Emitir</div>
    ${site
      ? `<a class="btn" id="c_emitir" href="${escapeAttr(site.url)}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;justify-content:center;">🌐 Abrir site de emissão</a>
         <div class="hint" style="margin:-6px 0 0;word-break:break-all;">${escapeHtml(site.url)} <span class="muted">— ${escapeHtml(site.origem)}</span></div>`

  const q = s=>overlay.querySelector(s);

      scheduleSave(); overlay.remove(); render(); toast('Registro removido.');
    };

  q('#c_save').onclick = ()=>{

    const ult = q('#c_ult').value, prox = q('#c_prox').value;

    scheduleSave(); overlay.remove(); render(); toast('Certidão atualizada.');
  };
}

function parseDateFlexible(str){
  str = String(str||'').trim();
  if(!str) return null;
  let m = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);
  if(m) return `${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  m = str.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2})$/);
  if(m) return `20${m[3]}-${pad2(m[2])}-${pad2(m[1])}`;
  return null;
}

function parseImportCertidoes(raw){
  const lines = raw.split('\n').map(l=>l.replace(/\r$/,'')).filter(l=>l.trim()!=='');
  const rows = [];
  lines.forEach((line, idx)=>{
    const sep = line.includes('\t') ? '\t' : line.includes(';') ? ';' : ',';
    const cols = line.split(sep).map(c=>c.trim());
    if(cols.length<2) return;
    const [instRaw, tipoRaw, ultimaRaw, proxRaw, linkRaw] = cols;
    const ultima = parseDateFlexible(ultimaRaw), proxima = parseDateFlexible(proxRaw);
    if(idx===0 && !ultima && !proxima && (normalizeStr(instRaw).includes('instituic') || normalizeStr(tipoRaw).includes('certid'))) return;
    const inst = state.instituicoes.find(i=>normalizeStr(i.nome)===normalizeStr(instRaw) || (i.sigla && normalizeStr(i.sigla)===normalizeStr(instRaw)));
    const tipo = state.certidaoTipos.find(t=>normalizeStr(t.nome)===normalizeStr(tipoRaw));
    let status='ok', error='';
    if(!inst){ status='erro'; error='instituição não encontrada'; }
    else if(!tipo){ status='erro'; error='certidão não encontrada'; }
    else if(ultimaRaw && !ultima){ status='erro'; error='data de renovação inválida'; }
    else if(proxRaw && !proxima){ status='erro'; error='data de vencimento inválida'; }
    else if(linkRaw && !isUrl(linkRaw)){ status='erro'; error='link inválido'; }
    rows.push({instRaw:instRaw||'', tipoRaw:tipoRaw||'', instId:inst?inst.id:null, tipoId:tipo?tipo.id:null,
      ultimaRenovacao:ultima||'', proximoVencimento:proxima||'', link:linkRaw||'', status, error});
  });
  return rows;
}

      </table></div>`;
    overlay.querySelector('#imp_confirm').style.display = okCount ? 'inline-flex' : 'none';
  };
  overlay.querySelector('#imp_confirm').onclick = ()=>{
    let count=0;
    parsed.filter(r=>r.status==='ok').forEach(r=>{
      let cert = state.certidoes.find(x=>x.instituicaoId===r.instId && x.tipoId===r.tipoId);
      if(!cert){ cert = {id:uid(), instituicaoId:r.instId, tipoId:r.tipoId, ultimaRenovacao:'', proximoVencimento:'', link:''}; state.certidoes.push(cert); }

      if(r.proximoVencimento) cert.proximoVencimento = r.proximoVencimento;
      if(r.link) cert.link = r.link;

    });

  };

function linkIcon(cat){
  const c = normalizeStr(cat);
  if(c.includes('senha') || c.includes('acesso')) return '🔑';
  if(c.includes('pasta') || c.includes('drive') || c.includes('sharepoint')) return '📁';
  if(c.includes('planilha')) return '📊';
  if(c.includes('certid')) return '📄';
  return '🔗';
}

function renderLinks(c){
  const f = linkFilters;
  const cats = [...new Set([...LINK_CATS, ...state.links.map(l=>l.categoria).filter(Boolean)])];
  const filterBar = document.createElement('div');
  filterBar.className='filters';
  filterBar.innerHTML = `
    <input type="text" id="lBusca" placeholder="🔎 Buscar link..." value="${escapeAttr(f.busca)}">

  filterBar.querySelector('#lInst').onchange = e=>{ f.inst = e.target.value; render(); };
  filterBar.querySelector('#lCat').onchange = e=>{ f.cat = e.target.value; render(); };
  const lc = filterBar.querySelector('#lClear');
  if(lc) lc.onclick = ()=>{ linkFilters = {inst:'', cat:'', busca:''}; render(); };

  const note = document.createElement('div');
  note.className = 'note';
  note.innerHTML = '🔑 <b>Acessos e senhas:</b> use a categoria "Acesso / Senha" para guardar o endereço do sistema, o usuário e a senha. A senha aparece escondida (••••) — clique em 👁 para ver e em 📋 para copiar.';
  c.appendChild(note);

  const filtering = !!(f.inst||f.cat||f.busca);
  const match = l=>{
    if(f.cat && l.categoria!==f.cat) return false;
    if(f.busca){ const q = normalizeStr(f.busca); if(![l.titulo,l.url,l.usuario,l.obs,l.categoria].some(v=>normalizeStr(v).includes(q))) return false; }
    return true;
  };
  function linkGrid(links){
    const grid = document.createElement('div');
    grid.className='cert-grid';
    grid.style.cssText = 'background:transparent;gap:9px;';
    links.forEach(l=>{
      const cell = document.createElement('div');
      cell.className='cert-cell';
      cell.style.cssText = 'border:1px solid var(--line-soft);border-radius:8px;';
      cell.innerHTML = `
        <div class="cn">${linkIcon(l.categoria)} ${escapeHtml(l.titulo)}</div>
        ${l.categoria?`<span class="tag" style="display:inline-block;margin-bottom:6px;">${escapeHtml(l.categoria)}</span>`:''}
        ${l.url?`<div class="cd" style="margin-top:2px;"><a href="${escapeAttr(l.url)}" target="_blank" rel="noopener" class="lk" style="color:var(--teal);text-decoration:underline;word-break:break-all;">${escapeHtml(l.url)}</a></div>`:''}

        ${l.senha?`<div class="cd" style="margin-top:4px;align-items:center;"><span style="word-break:break-all;">Senha: <b class="pwVal" style="color:var(--ink);">••••••••</b></span><span style="display:flex;flex:none;"><button class="icon-btn pwShow" title="Mostrar/ocultar senha">👁</button><button class="icon-btn cpS" title="Copiar senha">📋</button></span></div>`:''}
        ${l.obs?`<div class="cd" style="margin-top:6px;white-space:pre-wrap;font-family:var(--font-body);">${escapeHtml(l.obs)}</div>`:''}`;
      const a = cell.querySelector('.lk'); if(a) a.onclick = e=>e.stopPropagation();
      const cu = cell.querySelector('.cpU'); if(cu) cu.onclick = e=>{ e.stopPropagation(); copyText(l.usuario, 'Usuário copiado!'); };
      const cs = cell.querySelector('.cpS'); if(cs) cs.onclick = e=>{ e.stopPropagation(); copyText(l.senha, 'Senha copiada!'); };
      const ps = cell.querySelector('.pwShow');
      if(ps) ps.onclick = e=>{
        e.stopPropagation();
        const v = cell.querySelector('.pwVal'), vis = v.dataset.vis==='1';
        v.textContent = vis ? '••••••••' : l.senha; v.dataset.vis = vis ? '' : '1';
      };
      cell.onclick = ()=>openLinkModal(l.id);
      grid.appendChild(cell);
    });
    return grid;
  }
  function section(title, links, container){
    const w = document.createElement('div');
    w.style.cssText = 'padding:12px 0;border-top:1px solid var(--line-soft);';
    w.innerHTML = `<div style="font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;">${escapeHtml(title)}</div>`;
    if(links.length) w.appendChild(linkGrid(links));
    else w.innerHTML += `<div class="small muted">Nenhum link cadastrado.</div>`;
    container.appendChild(w);
  }
  let shown = 0;
  function block(title, cor, groups){
    const visible = groups.filter(g=>g.links.length || !filtering);
    if(!visible.length) return;
    const b = document.createElement('div');
    b.className = 'inst-block';
    b.innerHTML = `<div class="inst-head">${cor?`<span class="inst-swatch" style="background:${cor}"></span>`:'<span>🌐</span>'}<h3>${escapeHtml(title)}</h3></div>`;
    const body = document.createElement('div');
    body.style.padding = '4px 16px 14px';
    visible.forEach(g=>{ shown += g.links.length; section(g.title, g.links, body); });
    b.appendChild(body);
    c.appendChild(b);
  }

  const gerais = state.links.filter(l=>!l.instituicaoId && match(l));
  if((!f.inst || f.inst==='__geral') && (gerais.length || f.inst==='__geral')) block('Links gerais', null, [{title:'Todas as instituições', links:gerais}]);
  if(f.inst!=='__geral'){
    state.instituicoes.filter(i=>!f.inst || i.id===f.inst).forEach(inst=>{
      const own = state.links.filter(l=>l.instituicaoId===inst.id && match(l));
      const groups = [{title:'Geral da instituição', links: own.filter(l=>!l.projetoId || !projById(inst.id, l.projetoId))}];
      inst.projetos.forEach(p=>groups.push({title: projLabel(p), links: own.filter(l=>l.projetoId===p.id)}));
      block(instLabel(inst), inst.cor, groups);
    });
  }
  if(state.links.length===0){
    const e = document.createElement('div');
    e.className='empty-state';
    e.innerHTML = `<div class="big">Nenhum link cadastrado ainda</div><div>Use "+ Novo link" para guardar pastas, SharePoints, sistemas e acessos de cada instituição ou projeto.</div>`;
    c.appendChild(e);
  } else if(filtering && shown===0){
    c.innerHTML += `<div class="empty-state"><div>Nenhum link com esses filtros.</div></div>`;
  }
}

/* ================== CONFIGURAÇÕES ================== */
function renderConfig(c){
  const wrap = document.createElement('div');

  // Lista simples editável (strings), com arrastar para reordenar
  function stringListSection(title, hint, arr, addLabel, newValue){
    const s = document.createElement('div'); s.className='cfg-section';
    s.innerHTML = `<h3>${title}</h3><div class="hint">${hint}</div>`;
    const list = document.createElement('div'); list.className='cfg-list';
    arr.forEach((val, idx)=>{
      const row = document.createElement('div'); row.className='cfg-row'; row.draggable = true;
      row.innerHTML = `<span title="Arraste para reordenar" style="cursor:grab;color:var(--muted);padding:0 2px;user-select:none;">⠿</span>
        <input value="${escapeAttr(val)}"><button class="icon-btn del" title="Remover">✕</button>`;
      row.querySelector('input').oninput = e=>{ arr[idx] = e.target.value; scheduleSave(); };
      row.querySelector('button').onclick = ()=>{ if(!confirm(`Remover "${val}"?`)) return; arr.splice(idx,1); scheduleSave(); render(); };
      row.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', String(idx)); row.style.opacity='.5'; });
      row.addEventListener('dragend', ()=>{ row.style.opacity='1'; });
      row.addEventListener('dragover', e=>{ e.preventDefault(); row.style.background='var(--paper-dim)'; });
      row.addEventListener('dragleave', ()=>{ row.style.background=''; });
      row.addEventListener('drop', e=>{
        e.preventDefault(); row.style.background='';
        const from = parseInt(e.dataTransfer.getData('text/plain'));
        if(isNaN(from) || from===idx) return;
        arr.splice(idx, 0, arr.splice(from,1)[0]);
        scheduleSave(); render();
      });
      list.appendChild(row);
    });
    s.appendChild(list);
    const add = document.createElement('button');
    add.className='btn ghost small'; add.style.marginTop='10px'; add.textContent = addLabel;
    add.onclick = ()=>{ arr.push(newValue); scheduleSave(); render(); };
    s.appendChild(add);
    return s;
  }

  // Tipos de certidão
  const s1 = document.createElement('div'); s1.className='cfg-section';
  s1.innerHTML = `<h3>Tipos de certidão e documentos</h3><div class="hint">A lista de certidões acompanhadas em todas as instituições. Os tipos ficam só aqui — não aparecem como projetos. <b>Site de emissão</b>: o endereço que abre no botão "🌐 emitir" (cada instituição pode ter um site próprio, definido na própria certidão; a municipal usa a cidade da instituição quando é Curitiba, Colombo ou São José dos Pinhais). <br><b>Categoria</b> define quem recebe o aviso (veja "Responsáveis pelos avisos" abaixo). <b>Regra de notificação</b>: no dia do vencimento, 1 dia após o vencimento (para certidões que só podem ser renovadas no dia seguinte), 4 meses antes (o alerta começa no 1º dia do mês, 4 meses antes do vencimento) ou sem aviso.</div>`;
  const l1 = document.createElement('div'); l1.className='cfg-list';
  state.certidaoTipos.forEach(tipo=>{
    const row = document.createElement('div'); row.className='cfg-row';
    row.style.flexWrap = 'wrap';
    row.innerHTML = `<input value="${escapeAttr(tipo.nome)}" class="tNome" style="flex:1 1 200px;">
      <input value="${escapeAttr(tipo.siteEmissao||'')}" class="tSite" placeholder="🌐 Site de emissão (https://...)" style="flex:2 1 260px;font-size:12.5px;color:var(--teal);">
      <select class="tCat" title="Categoria" style="flex:1 1 170px;padding:6px 8px;border:1px solid var(--line-soft);border-radius:6px;background:var(--white);font-size:12.5px;">${CATEGORIAS_DOC.map(([v,l])=>`<option value="${v}" ${tipo.categoria===v?'selected':''}>${l}</option>`).join('')}</select>
      <select class="tRegra" title="Regra de notificação de vencimento" style="flex:1 1 230px;padding:6px 8px;border:1px solid var(--line-soft);border-radius:6px;background:var(--white);font-size:12.5px;">${REGRAS_NOTIF.map(([v,l])=>`<option value="${v}" ${tipo.regraNotif===v?'selected':''}>${l}</option>`).join('')}</select>
      <button class="icon-btn del" title="Remover">✕</button>`;
    row.querySelector('.tNome').oninput = e=>{ tipo.nome = e.target.value; scheduleSave(); };
    row.querySelector('.tCat').onchange = e=>{ tipo.categoria = e.target.value; scheduleSave(); render(); };
    row.querySelector('.tRegra').onchange = e=>{ tipo.regraNotif = e.target.value; scheduleSave(); render(); };
    row.querySelector('.tSite').onchange = e=>{
      const v = e.target.value.trim();
      if(v && !isUrl(v)){ toast('O site precisa começar com http:// ou https://'); e.target.value = tipo.siteEmissao||''; return; }
      tipo.siteEmissao = v; scheduleSave();
    };
    row.querySelector('.del').onclick = ()=>{
      if(!confirm(`Remover "${tipo.nome}" de todas as instituições? As datas e links já registrados desse tipo serão apagados.`)) return;
      state.certidaoTipos = state.certidaoTipos.filter(t=>t.id!==tipo.id);
      state.certidoes = state.certidoes.filter(x=>x.tipoId!==tipo.id);
      scheduleSave(); render();
    };
    l1.appendChild(row);
  });
  s1.appendChild(l1);
  const add1 = document.createElement('button');
  add1.className='btn ghost small'; add1.style.marginTop='10px'; add1.textContent='+ Adicionar tipo de certidão';
  add1.textContent='+ Adicionar tipo de certidão / documento';
  add1.onclick = ()=>openNovoTipoDocModal();
  s1.appendChild(add1);
  wrap.appendChild(s1);

  wrap.appendChild(stringListSection('Tipos de tarefa', 'Opções do campo "Tipo" das tarefas. Arraste pelo ⠿ para mudar a ordem.', state.tiposTarefa, '+ Adicionar tipo de tarefa', 'Novo tipo'));
  wrap.appendChild(stringListSection('Origens de projeto', 'Opções do campo "Origem" dos projetos (prefeitura, estado, federal, ONU…).', state.origensProjeto, '+ Adicionar origem', 'Nova origem'));

  // Equipe
  const s3 = document.createElement('div'); s3.className='cfg-section';
  s3.innerHTML = `<h3>Equipe</h3><div class="hint">Quem entra no Gestor aparece aqui automaticamente no primeiro acesso. <b>O login e a senha de cada pessoa são criados na aba "Usuarios" da planilha</b> — o nome aqui precisa ser igual ao da planilha. WhatsApp + chave CallMeBot servem para os avisos automáticos (cada pessoa ativa a própria chave mandando "I allow callmebot to send me messages" para +34 644 84 71 04 no WhatsApp dela).</div>`;
  const l3 = document.createElement('div'); l3.className='cfg-list';
  state.membros.forEach(m=>{
    const row = document.createElement('div'); row.className='cfg-row'; row.style.flexWrap='wrap';
    row.innerHTML = `
      ${avatarBadge(m)}
      <input value="${escapeAttr(m.nome)}" class="mNome" style="flex:1;min-width:120px;" placeholder="Nome">
      <input value="${escapeAttr(m.whatsapp)}" class="mWpp" placeholder="WhatsApp: 5541999999999" style="flex:1;min-width:160px;">
      <input value="${escapeAttr(m.callmebotApiKey)}" class="mKey" placeholder="Chave CallMeBot" style="flex:1;min-width:120px;">
      <button class="icon-btn del" title="Remover">✕</button>`;
    row.querySelector('.mNome').onchange = e=>{ m.nome = e.target.value.trim() || m.nome; scheduleSave(); render(); updateUserBox(); };
    row.querySelector('.mWpp').oninput = e=>{ m.whatsapp = e.target.value.replace(/\D/g,''); scheduleSave(); };
    row.querySelector('.mKey').oninput = e=>{ m.callmebotApiKey = e.target.value.trim(); scheduleSave(); };
    row.querySelector('.del').onclick = ()=>{ if(!confirm(`Remover ${m.nome} da equipe? (O login dela continua na planilha — apague lá também.)`)) return; state.membros = state.membros.filter(x=>x.id!==m.id); scheduleSave(); render(); };
    l3.appendChild(row);
  });
  s3.appendChild(l3);
  const add3 = document.createElement('button');
  add3.className='btn ghost small'; add3.style.marginTop='10px'; add3.textContent='+ Adicionar pessoa';
  add3.onclick = ()=>{ state.membros.push({id:uid(), nome:'Nova pessoa', whatsapp:'', callmebotApiKey:'', cor: USER_PALETTE[state.membros.length % USER_PALETTE.length]}); scheduleSave(); render(); };
  s3.appendChild(add3);
  wrap.appendChild(s3);

  // Notificações
  const s4 = document.createElement('div'); s4.className='cfg-section';
  s4.innerHTML = `<h3>Responsáveis pelos avisos</h3><div class="hint">Quem recebe por WhatsApp os avisos de vencimento de cada categoria, conforme a regra de cada tipo (precisa ter WhatsApp e chave preenchidos acima). Podem ser pessoas diferentes.</div>`;
  const mkSel = (label, key)=>{
    const w = document.createElement('div'); w.className = 'field'; w.style.marginBottom = '10px';
    w.innerHTML = `<label>${label}</label>`;
    const sel = document.createElement('select');
    sel.style.cssText = 'max-width:320px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);';
    sel.innerHTML = `<option value="">— Ninguém selecionado —</option>` + state.membros.map(m=>`<option value="${m.id}" ${state[key]===m.id?'selected':''}>${escapeHtml(m.nome)}</option>`).join('');
    sel.onchange = e=>{ state[key] = e.target.value || null; scheduleSave(); };
    w.appendChild(sel); s4.appendChild(w);
  };
  mkSel('📄 Responsável pelas certidões convencionais', 'notifCertidaoMembroId');
  mkSel('🏛 Responsável pelos documentos institucionais (CMAS, CMDCA, COMTIBA, Ata de Eleição…)', 'notifInstitucionalMembroId');
  wrap.appendChild(s4);

  c.appendChild(wrap);
}

/* ================== INICIALIZAÇÃO ================== */
document.getElementById('fabAdd').onclick = ()=>{
  if(activeTab==='links') openLinkModal(null);
  else if(activeTab==='projetos') openProjModal(projFilters.inst || '', null);
  else if(activeTab==='instituicoes') openInstModal(null);
  else openTaskModal(null);
};
document.getElementById('loginBtn').onclick = doLogin;
document.getElementById('logoutBtn').onclick = ()=>doLogout();
document.getElementById('changePassBtn').onclick = openChangePasswordModal;
['loginPass','loginUser'].forEach(id=>document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); }));

async function initApp(){
  await loadState();
  updateUserBox();
}

(function boot(){
  const saved = sessionStorage.getItem('gp_session');
  if(saved){
    try{ session = JSON.parse(saved); hideLogin(); initApp(); return; }catch(e){}
  }
  showLogin();
})();
</script>
</body>
</html>
