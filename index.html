<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Projetos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#151a23; --ink-2:#1c222e;
    --paper:#f6f3ec; --paper-dim:#eae5d8;
    --line:#d9d2bf; --line-soft:#e5e0d2;
    --gold:#b5852c; --gold-soft:#e8c98a;
    --teal:#2f6f6a; --teal-soft:#d6e6e4;
    --rust:#a8452f; --rust-soft:#f3d9d1;
    --ok:#3c7a4c; --ok-soft:#dcebdf;
    --warn:#b5852c; --warn-soft:#f3e6c9;
    --bad:#a8452f; --bad-soft:#f3d9d1;
    --muted:#6b6455; --white:#fffdf8;
    --shadow: 0 1px 2px rgba(21,26,35,.06), 0 8px 24px -12px rgba(21,26,35,.18);
    --radius: 10px;
    --font-display: 'Fraunces', Georgia, serif;
    --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font-body);
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }
  ::selection{background:var(--gold-soft);}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  #app{max-width:1900px;width:100%;margin:0 auto;padding:0 24px 12px;flex:1;display:flex;flex-direction:column;min-height:0;}
  header.top, nav.tabs, #banner{flex:none;}
  #tabContent{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;}

  header.top{padding:28px 0 18px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);margin-bottom:22px;}
  header.top .brand-mark{width:38px;height:38px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--paper);font-family:var(--font-display);font-weight:700;font-size:18px;flex:none;}
  header.top h1{font-family:var(--font-display);font-weight:600;font-size:26px;margin:0;letter-spacing:-.01em;}
  header.top .head-left{display:flex;gap:12px;align-items:center;}
  header.top .save-state{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;}
  .dot.saving{background:var(--gold);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  nav.tabs{display:flex;gap:4px;margin-bottom:22px;border-bottom:1px solid var(--line);overflow-x:auto;}
  nav.tabs button{background:none;border:none;padding:10px 4px;margin-right:22px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;position:relative;top:1px;white-space:nowrap;}
  nav.tabs button .count{font-family:var(--font-mono);font-size:11px;font-weight:500;background:var(--paper-dim);color:var(--muted);padding:1px 6px;border-radius:20px;margin-left:6px;}
  nav.tabs button.active{color:var(--ink);border-bottom-color:var(--gold);}
  nav.tabs button.active .count{background:var(--ink);color:var(--paper);}
  nav.tabs button:hover{color:var(--ink);}

  .banner{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:22px;}
  .banner .cell{background:var(--white);padding:14px 16px;}
  .banner .cell.click{cursor:pointer;}
  .banner .cell.click:hover{background:#fbf8f1;}
  .banner .cell .num{font-family:var(--font-display);font-size:26px;font-weight:600;line-height:1;}
  .banner .cell .lbl{font-size:12px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.04em;}
  .banner .cell.bad .num{color:var(--bad);}
  .banner .cell.warn .num{color:var(--warn);}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
  .filters select, .filters input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);font-size:13.5px;min-width:150px;max-width:240px;}
  .filters .spacer{flex:1;}
  .filters label.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}
  .btn{padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;transition:transform .1s, box-shadow .1s;}
  .btn:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:500;}
  .btn.ghost:hover{border-color:var(--ink);}
  .btn.small{padding:5px 10px;font-size:12.5px;}
  .btn.danger{background:var(--rust);border-color:var(--rust);}
  .chip-clear{font-size:12.5px;color:var(--muted);text-decoration:underline;background:none;border:none;padding:4px 2px;}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .chip{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--ink);}
  .chip .n{font-family:var(--font-mono);margin-left:5px;opacity:.6;font-weight:500;}
  .chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .chip.acomp{border-color:var(--gold);}

  .bulk-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--ink);color:var(--paper);padding:10px 14px;border-radius:9px;margin-bottom:14px;font-size:13px;}
  .bulk-bar .count{font-weight:700;font-family:var(--font-mono);}
  .bulk-bar .spacer{flex:1;}
  .bulk-bar button{padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:var(--paper);font-size:12.5px;font-weight:600;}
  .bulk-bar button:hover{background:rgba(255,255,255,.18);}
  .bulk-bar button.danger{background:var(--rust);border-color:var(--rust);}
  .unread-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block;margin-right:6px;flex:none;}

  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--white);}
  .tbl th{position:sticky;top:0;background:var(--paper-dim);text-align:left;padding:10px 12px;z-index:1;font-weight:600;white-space:nowrap;}
  .tbl td{padding:9px 12px;border-top:1px solid var(--line-soft);vertical-align:middle;}
  .tbl tr.click{cursor:pointer;}
  .tbl tr.click:hover td{background:#fbf8f1;}
  .mono{font-family:var(--font-mono);}
  .muted{color:var(--muted);}
  .small{font-size:12px;}

  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
  .col{background:var(--paper-dim);border-radius:var(--radius);padding:10px;min-height:80px;}
  .col-head{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 10px;}
  .col-head h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted);}
  .col-head .n{font-family:var(--font-mono);font-size:12px;color:var(--muted);}
  .card{background:var(--white);border:1px solid var(--line-soft);border-radius:9px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:box-shadow .12s, transform .12s;border-left:4px solid var(--inst-color, var(--ink));}
  .card:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px;}
  .tag{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:2px 7px;border-radius:20px;background:var(--paper-dim);color:var(--ink);font-weight:600;}
  .tag.type{background:var(--ink);color:var(--paper);}
  .card h4{margin:0 0 6px;font-size:14px;line-height:1.3;}
  .card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;font-size:12px;color:var(--muted);}
  .card .who{display:flex;align-items:center;gap:5px;}
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex:none;font-family:var(--font-mono);}
  .due{font-family:var(--font-mono);font-weight:600;}
  .due.overdue{color:var(--bad);}
  .due.soon{color:var(--warn);}
  .empty-col{padding:20px 8px;text-align:center;color:var(--muted);font-size:12.5px;}

  .inst-block{margin-bottom:20px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--white);}
  .inst-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--paper-dim);border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .inst-swatch{width:10px;height:10px;border-radius:3px;flex:none;}
  .inst-head h3{margin:0;font-size:15px;font-family:var(--font-display);font-weight:600;}
  .inst-head .stats{margin-left:auto;display:flex;gap:8px;font-family:var(--font-mono);font-size:11px;}
  .inst-head .actions{margin-left:auto;display:flex;gap:6px;}
  .cert-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1px;background:var(--line-soft);}
  .cert-cell{background:var(--white);padding:12px 16px;cursor:pointer;transition:background .12s;}
  .cert-cell:hover{background:var(--paper-dim);}
  .cert-cell .cn{font-size:13px;font-weight:600;margin-bottom:5px;}
  .cert-cell .cd{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);display:flex;justify-content:space-between;gap:8px;}
  .cert-cell .foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px;flex-wrap:wrap;}
  .file-link{white-space:nowrap;font-size:11.5px;font-weight:600;color:var(--teal);text-decoration:none;border:1px solid var(--teal-soft);background:var(--teal-soft);padding:2px 8px;border-radius:20px;}
  .file-link:hover{border-color:var(--teal);}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-family:var(--font-mono);white-space:nowrap;}
  .badge.ok{background:var(--ok-soft);color:var(--ok);}
  .badge.warn{background:var(--warn-soft);color:#8a6420;}
  .badge.bad{background:var(--bad-soft);color:var(--bad);}
  .badge.info{background:var(--teal-soft);color:var(--teal);}
  .badge.none, .badge.done{background:var(--paper-dim);color:var(--muted);}
  .badge.na{background:transparent;color:var(--muted);border:1px dashed var(--line);}
  .cert-cell.na{opacity:.6;}
  .cert-cell.na .cn{text-decoration:line-through;text-decoration-color:var(--line);}
  .regra-tag{font-size:10.5px;color:var(--muted);margin:-2px 0 5px;}

  /* Instituições */
  .inst-body{display:grid;grid-template-columns:repeat(3,1fr);}
  .form-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
  .form-col{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0;}
  .form-col h3{font-family:var(--font-display);font-size:15px;font-weight:600;margin:0 0 2px;padding-bottom:8px;border-bottom:1px solid var(--line-soft);}
  .form-col .addr-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:4px 0 -4px;}
  .field-row.r-3-1{grid-template-columns:3fr 1fr;}
  .field-row.r-1-2{grid-template-columns:1fr 2fr;}
  .kv-col{padding:12px 16px;}
  .kv-col + .kv-col{border-left:1px solid var(--line-soft);}
  .kv-col h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);}
  .kv{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line-soft);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{width:118px;color:var(--muted);font-size:12px;flex:none;}
  .kv .v{flex:1;word-break:break-word;}
  .kv .v.empty{color:var(--line);}
  .inst-projs{padding:10px 16px 14px;border-top:1px solid var(--line-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .proj-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;font-size:12.5px;background:var(--white);cursor:pointer;}
  .proj-pill:hover{border-color:var(--ink);}

  .cfg-section{margin-bottom:28px;max-width:900px;}
  .cfg-section h3{font-family:var(--font-display);font-size:17px;margin:0 0 4px;}
  .hint{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
  .cfg-list{display:flex;flex-direction:column;gap:8px;}
  .cfg-row{display:flex;align-items:center;gap:8px;background:var(--white);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;}
  .cfg-row input{flex:1;border:none;background:transparent;padding:4px;min-width:0;}
  .cfg-row input:focus{outline:none;background:var(--paper-dim);border-radius:5px;}
  .icon-btn{border:none;background:none;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px;line-height:1;}
  .icon-btn:hover{background:var(--paper-dim);color:var(--ink);}
  .icon-btn.del:hover{color:var(--rust);}

  .overlay{position:fixed;inset:0;background:rgba(21,26,35,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(2px);}
  .modal{background:var(--paper);border-radius:14px;max-width:560px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.35);border:1px solid var(--line);}
  .modal-head{padding:20px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;}
  .modal-head h2{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
  .modal-close{background:none;border:none;font-size:20px;color:var(--muted);padding:2px 8px;}
  .modal-body{padding:4px 22px 22px;display:flex;flex-direction:column;gap:14px;}
  .modal-sub{font-family:var(--font-display);font-size:15px;font-weight:600;margin:6px 0 -4px;padding-top:10px;border-top:1px solid var(--line-soft);}
  .field label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px;}
  .field input, .field select, .field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--white);}
  .field textarea{min-height:70px;resize:vertical;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line-soft);}
  .status-picker{display:flex;gap:6px;}
  .status-picker button{flex:1;padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--white);font-size:12px;font-weight:600;color:var(--muted);}
  .status-picker button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
  .check-grid label{display:flex;align-items:center;gap:7px;font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500;margin:0;background:var(--white);border:1px solid var(--line-soft);border-radius:7px;padding:6px 8px;}
  .check-grid input{width:auto !important;}
  .swatches{display:flex;gap:8px;}
  .swatches button{width:26px;height:26px;border-radius:6px;border:2px solid transparent;}
  .swatches button.active{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset;}
  .hist{display:flex;flex-direction:column;gap:5px;max-height:160px;overflow-y:auto;}
  .hist div{font-size:12.5px;display:flex;gap:8px;align-items:center;}

  .fab{position:fixed;bottom:24px;right:24px;z-index:40;box-shadow:0 10px 30px rgba(21,26,35,.35);}
  .toast{position:fixed;bottom:24px;left:24px;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-size:13px;z-index:600;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;}
  .toast.show{opacity:1;transform:translateY(0);}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-state .big{font-family:var(--font-display);font-size:20px;color:var(--ink);margin-bottom:6px;}
  .note{background:var(--warn-soft);border-radius:8px;padding:9px 12px;font-size:12.5px;color:#6d5320;margin-bottom:14px;}

  @media (max-width:1100px){
    .inst-body{grid-template-columns:1fr;}
    .kv-col + .kv-col{border-left:none;border-top:1px solid var(--line-soft);}
    .form-cols{grid-template-columns:1fr;}
  }
  @media (max-width:860px){
    #app{padding:0 16px 12px;}
    .board{grid-template-columns:1fr;}
    header.top{padding:20px 0 14px;}
    header.top h1{font-size:21px;}
    .field-row, .field-row.r-3-1, .field-row.r-1-2, .check-grid{grid-template-columns:1fr;}
    .inst-body{grid-template-columns:1fr;}
    .kv-col + .kv-col{border-left:none;border-top:1px solid var(--line-soft);}
    .fab{bottom:16px;right:16px;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="head-left">
      <div class="brand-mark">GP</div>
      <div><h1>Gestor de Projetos</h1></div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
      <div class="save-state"><span class="dot" id="saveDot"></span><span id="saveLabel">carregando…</span></div>
      <div id="userBox" style="display:none;align-items:center;gap:8px;font-size:13px;">
        <span class="avatar" id="userAvatar"></span>
        <span id="userName" style="font-weight:600;"></span>
        <button class="btn ghost small" id="changePassBtn">Trocar senha</button>
        <button class="btn ghost small" id="logoutBtn">Sair</button>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs"></nav>
  <div id="banner" class="banner"></div>
  <div id="tabContent"></div>
</div>

<button class="btn fab" id="fabAdd" style="display:none;">+ Nova tarefa</button>
<div class="toast" id="toast"></div>

<!-- ===== Login ===== -->
<div class="overlay" id="loginOverlay" style="z-index:500;">
  <div class="modal" style="max-width:360px;">
    <div class="modal-head"><h2>Entrar</h2></div>
    <div class="modal-body">
      <div class="hint" style="margin:-8px 0 0;">Acesso ao Gestor de Projetos.</div>
      <div class="field"><label>Usuário</label><input id="loginUser" placeholder="seu usuário" autocomplete="username"></div>
      <div class="field"><label>Senha</label><input id="loginPass" type="password" placeholder="sua senha" autocomplete="current-password"></div>
      <div id="loginError" style="color:var(--bad);font-size:13px;display:none;"></div>
      <div class="modal-actions" style="justify-content:flex-end;"><button class="btn" id="loginBtn">Entrar</button></div>
    </div>
  </div>
</div>

<script>
/* ================== CONFIGURAÇÃO ================== */
// Cole aqui a URL do Web App do Google Apps Script (termina em /exec)
const API_URL = 'https://script.google.com/macros/s/AKfycbyRPTARNuu6XsreTKxfAS-f87-iXMocJA_PyAKxtzY_STeFyKOpuITqBhQ75it0huIh/exec';

/* ================== CONSTANTES ================== */
const uid = () => Math.random().toString(36).slice(2,10);
const PALETTE = ['#2f6f6a','#a8452f','#8a6d3b','#4a5a8a','#6a4a7a','#3c7a4c','#7a5a3a','#5a6a7a'];
const USER_PALETTE = ['#C9D6EE','#E3D2EE','#C8E6E1','#C7E1E8','#D8D2F0','#EED2E4','#D2E5DC','#D6DCEE'];

// Ciclo do projeto. "acomp" = status que exige acompanhamento de prazos (entra no indicador do topo).
const PROJ_STATUS = [
  {id:'proposta',           label:'Proposta',                                   curto:'Proposta',            cls:'none'},
  {id:'tramitacao',         label:'Em tramitação',                              curto:'Em tramitação',       cls:'warn', acomp:true},
  {id:'aprovacao',          label:'Aprovação do edital',                        curto:'Aprovação do edital', cls:'info'},
  {id:'contrato',           label:'Assinatura de contrato / abertura de conta', curto:'Contrato / conta',    cls:'info'},

/* ================== API (Google Sheets via Apps Script) ================== */
async function apiCall(action, params, method, _isRetry){
  if(!API_URL || API_URL.indexOf('COLE_AQUI') === 0){
    throw new Error('A URL do Apps Script ainda não foi configurada no topo do arquivo (API_URL).');
  }
  try{
    let res;
    if(method === 'POST'){
      res = await fetch(API_URL, {method:'POST', body: new URLSearchParams({action, ...params})});
    } else {
      res = await fetch(`${API_URL}?${new URLSearchParams({action, ...params}).toString()}`);
    }
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }catch(e){
    if(!_isRetry){ await new Promise(r=>setTimeout(r, 900)); return apiCall(action, params, method, true); }
    throw e;
  }
}
const apiLogin = (usuario, senha)=> apiCall('login', {usuario, senha}, 'POST');
const apiGetData = ()=> apiCall('getData', {token: session.token}, 'POST'); // tudo por POST: nesta publicação, respostas de GET voltam 404
const apiSaveData = (obj)=> apiCall('saveData', {token: session.token, payload: JSON.stringify(obj)}, 'POST');

}

const END_KEYS = ['cep','logradouro','numero','complemento','bairro','cidade','uf'];
function normalizeEnd(e, legado){
  if(!e || typeof e !== 'object') e = {};
  END_KEYS.forEach(k=>{ if(typeof e[k] !== 'string') e[k] = ''; });
  // endereço antigo (texto único) vai para o logradouro, para não perder nada
  if(legado && END_KEYS.every(k=>!e[k])) e.logradouro = legado;
  return e;
}
function normalizePessoa(o, keys, legadoEnd){
  if(!o || typeof o !== 'object') o = {};
  keys.forEach(k=>{ if(typeof o[k] !== 'string') o[k] = ''; });
  o.end = normalizeEnd(o.end, legadoEnd);
  return o;
}
const REP_KEYS = ['nome','cpf','rg','profissao','email','telefone'];
const CONT_KEYS = ['nome','cpf','rg','profissao','crcUf','crcNumero','email','telefone'];
function normalizeInst(i, idx, extrasStatus){
  i.nome = i.nome || 'Instituição';
  if(!i.cor) i.cor = PALETTE[idx % PALETTE.length];
  ['sigla','cnpj','email','endereco','telefone','dataInscricao'].forEach(k=>{ if(typeof i[k] !== 'string') i[k] = ''; });
  i.end = normalizeEnd(i.end, i.endereco);
  i.endereco = formatEnd(i.end);
  i.rep = normalizePessoa(i.rep, REP_KEYS);
  i.contador = normalizePessoa(i.contador, CONT_KEYS);
  if(typeof i.excluirIndicadores === 'undefined') i.excluirIndicadores = false;
  if(!Array.isArray(i.projetos)) i.projetos = [];
  i.projetos.forEach(p=>normalizeProj(p, extrasStatus));
}
function normalizeProj(p, extras){
  p.nome = p.nome || 'Projeto';
  ['codigo','origem','inicio','fim','obs'].forEach(k=>{ if(typeof p[k] !== 'string') p[k] = ''; });
  if(!allProjStatus(extras).some(s=>s.id===p.status)) p.status = 'proposta';
  if(typeof p.statusDesde !== 'string') p.statusDesde = '';
  if(!Array.isArray(p.historico)) p.historico = [];
  if(!Array.isArray(p.alteracaoTipos)) p.alteracaoTipos = [];
  if(!Array.isArray(p.registros)) p.registros = []; // Histórico do Projeto (linha do tempo)
}

function normalizeState(saved){

  ['membros','instituicoes','certidaoTipos','certidoes','links','tarefas'].forEach(k=>{ if(!Array.isArray(s[k])) s[k] = []; });
  if(!Array.isArray(s.tiposTarefa) || !s.tiposTarefa.length) s.tiposTarefa = defaultState().tiposTarefa;
  if(!Array.isArray(s.origensProjeto) || !s.origensProjeto.length) s.origensProjeto = defaultState().origensProjeto;
  s.membros.forEach((m,idx)=>{
    m.whatsapp = m.whatsapp || ''; m.callmebotApiKey = m.callmebotApiKey || '';
    if(!m.cor || !USER_PALETTE.includes(m.cor)) m.cor = USER_PALETTE[idx % USER_PALETTE.length];
  });
  // Status de projeto cadastrados pela equipe (botão + na janela do projeto)
  if(!Array.isArray(s.statusProjetoExtras)) s.statusProjetoExtras = [];
  s.statusProjetoExtras = s.statusProjetoExtras.filter(e=>e && e.id && e.label).map(e=>({
    id:String(e.id), label:String(e.label), curto:String(e.curto||e.label), cls: e.acomp ? 'warn' : 'info', acomp: !!e.acomp
  }));
  s.instituicoes.forEach((i,idx)=>normalizeInst(i, idx, s.statusProjetoExtras));
  s.certidoes.forEach(c=>{ if(typeof c.link !== 'string') c.link = ''; });
  s.certidaoTipos.forEach(ct=>{
    if(typeof ct.notificarApenasNoDia !== 'boolean') ct.notificarApenasNoDia = false;
    // Primeira vez: sugere o site oficial conhecido. Depois disso, vale o que a equipe cadastrar (inclusive vazio).
    if(typeof ct.siteEmissao !== 'string') ct.siteEmissao = siteConhecido(ct.nome);
    // Categoria e regra de aviso: definidas uma vez pelo nome ("Certidão..." = convencional); depois vale o que a equipe escolher.
    if(ct.categoria!=='certidao' && ct.categoria!=='institucional') ct.categoria = categoriaPadrao(ct.nome);
    if(!REGRAS_NOTIF.some(r=>r[0]===ct.regraNotif)) ct.regraNotif = ct.categoria==='certidao' ? 'dia' : '4meses';
  });
  s.certidoes.forEach(c=>{ c.naoAplica = !!c.naoAplica; });
  s.certidoes.forEach(c=>{ if(typeof c.siteEmissao !== 'string') c.siteEmissao = ''; });
  s.links.forEach(l=>{
    ['titulo','url','categoria','usuario','senha','obs','instituicaoId','projetoId'].forEach(k=>{ if(typeof l[k] !== 'string') l[k] = ''; });
  });
  s.tarefas.forEach(t=>{
    if(!Array.isArray(t.chat)) t.chat = [];
    if(!Array.isArray(t.checklist)) t.checklist = [];
    ['criadoEm','pendenteLeituraPara','pendenteDesde','concluidoEm','naoLidoPara','ultimaLeituraPor','ultimaLeituraEm','recorrencia'].forEach(k=>{ if(typeof t[k] === 'undefined') t[k] = null; });
    if(typeof t.projetoId !== 'string') t.projetoId = '';
  });
  if(typeof s.notifCertidaoMembroId === 'undefined') s.notifCertidaoMembroId = null;
  // Responsável pelos documentos institucionais: começa igual ao das certidões (ninguém fica sem aviso na troca de versão).
  if(!saved || !('notifInstitucionalMembroId' in saved)) s.notifInstitucionalMembroId = s.notifCertidaoMembroId;
  return s;
}

async function loadState(){
  let precisaSalvar = false;
  try{
    const res = await apiGetData();
    if(!res.ok){
      if(/sess/i.test(res.error||'')){ doLogout('Sua sessão expirou. Entre novamente.'); return; }
      throw new Error(res.error || 'Falha ao carregar dados.');
    }
    state = normalizeState(res.data);
    if(!res.data) precisaSalvar = true;
    // Quem entra pela primeira vez vira automaticamente membro da equipe (nome igual ao da aba "Usuarios").
    if(session && !state.membros.some(m=>normalizeStr(m.nome)===normalizeStr(session.nome))){
      state.membros.push({id:uid(), nome:session.nome, whatsapp:'', callmebotApiKey:'', cor: USER_PALETTE[state.membros.length % USER_PALETTE.length]});
      precisaSalvar = true;
    }
    if(precisaSalvar) await persist(true);
    setSaveState('ok');
  }catch(e){
    console.error('load error', e);
    setSaveState('error');
    toast('Erro ao carregar dados da planilha.');
    state = normalizeState(null);
  }
  render();
}

async function persist(silent){
  if(!silent) setSaveState('saving');
  try{
    const res = await apiSaveData(state);
    if(!res.ok){
      if(/sess/i.test(res.error||'')){ doLogout('Sua sessão expirou. Entre novamente — a última alteração pode não ter sido salva.'); return; }
      throw new Error(res.error);
    }
    setSaveState('ok');
  }catch(e){ console.error('save error', e); setSaveState('error'); }
}
function scheduleSave(){
  setSaveState('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>persist(false), 500);
}

function initials(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function fmtDate(d){ if(!d) return '—'; const dt = new Date(String(d).slice(0,10)+'T00:00:00'); return isNaN(dt) ? '—' : dt.toLocaleDateString('pt-BR'); }
function fmtDateTime(iso){
  if(!iso) return '—';
  const dt = new Date(iso);
  if(isNaN(dt)) return '—';
  return dt.toLocaleDateString('pt-BR') + ' ' + dt.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
}
function todayStr(){ const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function daysUntil(d){ if(!d) return null; const today = new Date(); today.setHours(0,0,0,0); const dt = new Date(String(d).slice(0,10)+'T00:00:00'); if(isNaN(dt)) return null; return Math.round((dt-today)/86400000); }
function pad2(n){ return String(n).padStart(2,'0'); }
function normalizeStr(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' '); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const escapeAttr = escapeHtml;
function isUrl(u){ return /^https?:\/\//i.test(u); }
// Transforma URLs (http://, https://, www.) em links clicáveis. Todo o resto é escapado —
// nenhum HTML digitado no comentário é executado, e só são gerados links http/https.
function linkifyText(text){
  const src = String(text==null?'':text);
  const re = /\b(?:https?:\/\/|www\.)[^\s<>"']+/gi;
  let out = '', last = 0, m;
  while((m = re.exec(src))){
    let url = m[0];
    const trail = url.match(/[.,;:!?)\]}]+$/); // pontuação no fim da frase não faz parte do link
    if(trail) url = url.slice(0, url.length - trail[0].length);
    if(!url || /^www\.$/i.test(url)) continue;
    const href = /^www\./i.test(url) ? 'https://' + url : url;
    let ok = false;
    try{ const u = new URL(href); ok = (u.protocol==='http:' || u.protocol==='https:') && !!u.hostname; }catch(e){}
    out += escapeHtml(src.slice(last, m.index));
    out += ok
      ? `<a href="${escapeAttr(href)}" target="_blank" rel="noopener noreferrer nofollow" style="color:var(--teal);text-decoration:underline;word-break:break-all;">${escapeHtml(url)}</a>`
      : escapeHtml(url);
    last = m.index + url.length;
    re.lastIndex = last;
  }
  return out + escapeHtml(src.slice(last));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2400);
}
async function copyText(text, okMsg){
  text = String(text||'').trim();
  if(!text){ toast('Nada para copiar.'); return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg || 'Copiado!'); }
  catch(e){
    const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(okMsg || 'Copiado!'); }catch(_){ toast('Não foi possível copiar — selecione o texto manualmente.'); }
    ta.remove();
  }
}
// Cria um modal padrão. Elementos com [data-close] fecham o modal.
function makeModal(title, bodyHtml, maxWidth){
  const overlay = document.createElement('div');

  overlay.innerHTML = `
    <div class="modal" style="${maxWidth?`max-width:${maxWidth}px;`:''}">
      <div class="modal-head"><h2>${title}</h2><button class="modal-close" data-close>✕</button></div>
      <div class="modal-body">${bodyHtml}</div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll('[data-close]').forEach(b=>b.onclick = ()=>overlay.remove());
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) overlay.remove(); });
  return overlay;
}

  c.innerHTML = '';
  const fabLabels = {tarefas:'+ Nova tarefa', projetos:'+ Novo projeto', instituicoes:'+ Nova instituição', links:'+ Novo link'};
  if(fabLabels[activeTab]){ fab.style.display='inline-flex'; fab.textContent = fabLabels[activeTab]; }
  else fab.style.display='none';
  if(activeTab==='tarefas') renderTarefas(c);
  else if(activeTab==='projetos') renderProjetos(makeScrollArea(c));
  else if(activeTab==='instituicoes') renderInstituicoes(makeScrollArea(c));
  else if(activeTab==='certidoes') renderCertidoes(makeScrollArea(c));
  else if(activeTab==='links') renderLinks(makeScrollArea(c));
  else renderConfig(makeScrollArea(c));
}

function allProjects(){
  const out = [];
  state.instituicoes.forEach(inst=>inst.projetos.forEach(p=>out.push({inst, p})));
  return out;
}

function renderTabs(){
  const nav = document.getElementById('tabs');
  const pendentes = state.tarefas.filter(t=>t.status!=='concluido').length;
  const projAtivos = allProjects().filter(x=>x.p.status!=='finalizado').length;
  const tabs = [
    ['tarefas','Tarefas',pendentes],
    ['projetos','Projetos',projAtivos],
    ['instituicoes','Instituições',state.instituicoes.length],
    ['certidoes','Certidões',countCertAlerts()],
    ['links','Central de Links',state.links.length],
    ['config','Configurações',null]
  ];
  nav.innerHTML = tabs.map(([id,label,n])=>`<button data-tab="${id}" class="${activeTab===id?'active':''}">${label}${n!==null?` <span class="count">${n}</span>`:''}</button>`).join('');
  nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{ activeTab=b.dataset.tab; selectedTaskIds.clear(); render(); });
}

function computeCertList(kind){
  const out = [];
  for(const inst of state.instituicoes){
    if(inst.excluirIndicadores) continue;
    for(const tipo of state.certidaoTipos){
      const c = state.certidoes.find(x=>x.instituicaoId===inst.id && x.tipoId===tipo.id);
      const st = certStatus(tipo, c); // "não se aplica" e "sem data" nunca entram aqui
      if(kind==='vencidas' && st.k==='vencida') out.push({inst, tipo, cert:c, dias:st.dias});
      else if(kind==='vencendo' && st.k==='alerta') out.push({inst, tipo, cert:c, dias:st.dias});
    }
  }
  return out.sort((a,b)=>a.dias-b.dias);
}
function countCertAlerts(){ return computeCertList('vencidas').length + computeCertList('vencendo').length; }

function openCertListModal(kind){
  const items = computeCertList(kind);
  const title = kind==='vencidas' ? 'Certidões e documentos vencidos' : 'Próximos do vencimento (dentro do prazo de aviso)';
  const overlay = makeModal(title, items.length===0 ? `<div class="hint" style="margin:0;">Nenhum registro nessa condição.</div>` : `
    <div class="tbl-wrap" style="max-height:60vh;overflow-y:auto;">
      <table class="tbl"><thead><tr><th>Instituição</th><th>Documento</th><th>Regra</th><th>Vencimento</th><th>${kind==='vencidas'?'Dias em atraso':'Dias restantes'}</th></tr></thead>
      <tbody>${items.map(it=>`
        <tr class="click" data-inst="${it.inst.id}" data-tipo="${it.tipo.id}">
          <td>${escapeHtml(instLabel(it.inst))}</td><td>${escapeHtml(it.tipo.nome)}</td><td class="small muted">${it.tipo.regraNotif==='4meses'?'4 meses':it.tipo.regraNotif==='nenhuma'?'sem aviso':it.tipo.regraNotif==='diaSeguinte'?'1 dia após':'no dia'}</td>
          <td class="mono">${fmtDate(it.cert.proximoVencimento)}</td>
          <td class="mono" style="color:${kind==='vencidas'?'var(--bad)':'var(--warn)'};">${Math.abs(it.dias)}</td>
        </tr>`).join('')}</tbody></table>
    </div>`, 680);
  overlay.querySelectorAll('tbody tr').forEach(tr=>tr.onclick = ()=>{
    overlay.remove(); activeTab='certidoes'; render(); openCertModal(tr.dataset.inst, tr.dataset.tipo);
  });
}

  } else {

    projFilterEl.innerHTML = `<option value="">Todos projetos</option>` + all.map(x=>`<option value="${x.p.id}" ${filters.proj===x.p.id?'selected':''}>${escapeHtml(instLabel(x.inst))} — ${escapeHtml(projLabel(x.p))}</option>`).join('');

function statusColorInfo(t){
  if(t.status==='concluido') return {label:'Concluído', cls:'done'};
  if(t.prazo && daysUntil(t.prazo) < 0) return {label:'Atrasada', cls:'bad'};
  if(t.status==='andamento') return {label:'Em Andamento', cls:'warn'};
  return {label:'A Fazer', cls:'ok'};
}

function renderTarefasBoard(c, list){
  const board = document.createElement('div');
  board.className = 'board';
  STATUS_COLS.forEach(col=>{
    const colEl = document.createElement('div');
    colEl.className='col';
    const items = list.filter(t=>t.status===col.id).sort((a,b)=>(a.prazo||'9999').localeCompare(b.prazo||'9999'));
    colEl.innerHTML = `<div class="col-head"><h3>${col.label}</h3><span class="n">${items.length}</span></div>`;
    if(items.length===0) colEl.innerHTML += `<div class="empty-col">—</div>`;
    else items.forEach(t=>colEl.appendChild(renderCard(t)));
    board.appendChild(colEl);
  });
  c.appendChild(board);

function renderCard(t){
  const inst = instById(t.instituicaoId);
  const proj = inst ? projById(inst.id, t.projetoId) : null;
  const resp = membroById(t.responsavelId);
  const du = t.prazo ? daysUntil(t.prazo) : null;
  let dueClass = '';
  if(du!==null && t.status!=='concluido'){ if(du<0) dueClass='overdue'; else if(du<=5) dueClass='soon'; }
  const card = document.createElement('div');
  card.className='card';
  if(inst) card.style.setProperty('--inst-color', inst.cor);
  card.innerHTML = `
    <div class="tags">
      <span class="tag type">${escapeHtml(t.tipo||'Outro')}</span>
      ${inst?`<span class="tag">${escapeHtml(instLabel(inst))}${proj?` · ${escapeHtml(proj.codigo||proj.nome)}`:''}</span>`:''}
    </div>
    <h4 style="font-weight:${t.naoLidoPara?800:500};">${t.naoLidoPara?'<span class="unread-dot"></span>':''}${t.recorrencia?'🔁 ':''}${escapeHtml(t.titulo)}</h4>
    ${t.checklist.length ? `<div style="font-size:11px;color:var(--muted);margin:-4px 0 2px;">☑ ${t.checklist.filter(i=>i.feito).length}/${t.checklist.length} do checklist</div>` : ''}

      <div class="who">${resp?avatarBadge(resp):'<span class="avatar">?</span>'}<span>${resp?escapeHtml(resp.nome.split(' ')[0]):'sem responsável'}</span></div>
      <span class="due ${dueClass}">${t.prazo? fmtDate(t.prazo) : 'sem prazo'}</span>
    </div>`;
  card.onclick = ()=>openTaskModal(t.id);
  return card;
}

        <button type="button" class="btn small" id="f_chk_add">Adicionar</button>
      </div>
      <div class="hint" style="margin:4px 0 0;">O checklist é só apoio — marcar todos os itens não conclui a tarefa.</div>
    </div>

    <div class="field"><label style="display:flex;align-items:center;gap:7px;text-transform:none;font-size:13px;color:var(--ink);">
      <input type="checkbox" id="f_recorrente" ${rec?'checked':''} style="width:auto;"> Tarefa recorrente</label></div>
    <div class="field-row" id="f_rec_wrap" style="display:${rec?'grid':'none'};">
      <div class="field"><label>Repetir</label>
        <select id="f_rec_tipo">
          ${[['dias','A cada X dias'],['semanal','Semanalmente'],['quinzenal','Quinzenalmente'],['mensal','Mensalmente'],['bimestral','Bimestralmente'],['semestral','Semestralmente']]
            .map(([v,l])=>`<option value="${v}" ${rec&&rec.tipo===v?'selected':''}>${l}</option>`).join('')}
        </select></div>
      <div class="field" id="f_rec_dias_wrap"><label>A cada quantos dias</label>
        <input type="number" min="1" id="f_rec_dias" value="${rec&&rec.valor?rec.valor:7}"></div>
    </div>

    <div class="field"><label>Status</label>
      <div class="status-picker" id="f_status">${STATUS_COLS.map(sc=>`<button type="button" data-s="${sc.id}" class="${t.status===sc.id?'active':''}">${sc.label}</button>`).join('')}</div></div>

    ${!isNew?`
    <div class="hint" id="f_leitura" style="margin:-6px 0 0;"></div>
    <div class="field"><label>Chat da tarefa</label>
      <div id="f_chat_list" style="max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--white);display:flex;flex-direction:column;gap:8px;"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input id="f_chat_input" placeholder="Escreva uma dúvida ou resposta..." style="flex:1;">
        <button class="btn small" id="f_chat_send">Enviar</button>
      </div></div>`:''}

    <div class="modal-actions">
      <div>${!isNew?`<button class="btn danger small" id="f_del">Excluir</button>`:''}</div>
      <div style="display:flex;gap:8px;"><button class="btn ghost" data-close>Cancelar</button>
        <button class="btn" id="f_save">${isNew?'Criar tarefa':'Salvar'}</button></div>
    </div>`);

  const instSel = overlay.querySelector('#f_inst');
  const projSel = overlay.querySelector('#f_proj');
  const refreshProj = sel=>{ projSel.innerHTML = projOptionsHtml(instById(instSel.value), sel, '— Geral da instituição —'); };
  refreshProj(t.projetoId);
  instSel.onchange = ()=>refreshProj('');

  overlay.querySelector('#f_tipo_add').onclick = ()=>openQuickTipoModal(nome=>{
    overlay.querySelector('#f_tipo').innerHTML = state.tiposTarefa.map(ti=>`<option ${ti===nome?'selected':''}>${escapeHtml(ti)}</option>`).join('');
  });

  // Checklist
  const chkList = overlay.querySelector('#f_chk_list'), chkProg = overlay.querySelector('#f_chk_prog');
  function commitChecklist(){ if(!isNew){ t.checklist = draftChecklist.map(i=>({...i})); scheduleSave(); } }
  function renderChecklist(){
    const total = draftChecklist.length, done = draftChecklist.filter(i=>i.feito).length;
    chkProg.textContent = total ? `— ${done} de ${total} concluído(s)` : '';
    if(!total){ chkList.innerHTML = `<div class="hint" style="margin:0;">Nenhum item ainda.</div>`; return; }
    chkList.innerHTML = draftChecklist.map(item=>`
      <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 8px;border:1px solid var(--line-soft);border-radius:7px;background:${item.feito?'var(--paper-dim)':'var(--white)'};text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);margin:0;">
        <input type="checkbox" data-id="${item.id}" class="chk-item" ${item.feito?'checked':''} style="width:auto;">
        <span style="flex:1;${item.feito?'text-decoration:line-through;color:var(--muted);':''}">${escapeHtml(item.texto)}</span>
        <button type="button" class="icon-btn del chk-del" data-id="${item.id}" title="Remover item">✕</button>
      </label>`).join('');
    chkList.querySelectorAll('.chk-item').forEach(cb=>cb.onchange = ()=>{
      const it = draftChecklist.find(i=>i.id===cb.dataset.id); if(it){ it.feito = cb.checked; commitChecklist(); renderChecklist(); }
    });
    chkList.querySelectorAll('.chk-del').forEach(b=>b.onclick = e=>{
      e.preventDefault();
      const idx = draftChecklist.findIndex(i=>i.id===b.dataset.id); if(idx>=0) draftChecklist.splice(idx,1);
      commitChecklist(); renderChecklist();
    });
  }
  renderChecklist();
  const chkInput = overlay.querySelector('#f_chk_input');
  const addChk = ()=>{ const tx = chkInput.value.trim(); if(!tx) return; draftChecklist.push({id:uid(), texto:tx, feito:false}); chkInput.value=''; commitChecklist(); renderChecklist(); };
  overlay.querySelector('#f_chk_add').onclick = addChk;
  chkInput.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); addChk(); } };

  // Recorrência
  const recCheckbox = overlay.querySelector('#f_recorrente'), recWrap = overlay.querySelector('#f_rec_wrap');
  const recTipoSel = overlay.querySelector('#f_rec_tipo'), recDiasWrap = overlay.querySelector('#f_rec_dias_wrap');
  const syncDias = ()=>{ recDiasWrap.style.display = recTipoSel.value==='dias' ? 'block' : 'none'; };
  recCheckbox.onchange = ()=>{ recWrap.style.display = recCheckbox.checked ? 'grid' : 'none'; syncDias(); };
  recTipoSel.onchange = syncDias;
  syncDias();

  // Chat
  if(!isNew){
    const leitura = overlay.querySelector('#f_leitura');
    const quem = t.ultimaLeituraPor ? membroById(t.ultimaLeituraPor) : null;
    leitura.textContent = t.ultimaLeituraEm ? `Última leitura: ${quem?quem.nome:'—'} em ${fmtDateTime(t.ultimaLeituraEm)}` : 'Ainda não foi lida por ninguém.';
    const chatList = overlay.querySelector('#f_chat_list');
    function renderChat(){
      if(!t.chat.length){ chatList.innerHTML = `<div class="hint" style="margin:0;">Nenhuma mensagem ainda.</div>`; return; }
      chatList.innerHTML = t.chat.map(msg=>{
        const autor = msg.autorId ? membroById(msg.autorId) : null;
        return `<div style="background:var(--paper-dim);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start;">
          <span class="avatar" style="background:${autor?membroColor(autor):'var(--ink)'};color:#2b2f38;">${initials(msg.autorNome||'—')}</span>
          <div><div style="font-size:11.5px;font-weight:700;">${escapeHtml(msg.autorNome||'—')} <span style="font-weight:400;color:var(--muted);">· ${fmtDateTime(msg.criadoEm)}</span></div>
          <div style="font-size:13px;margin-top:2px;white-space:pre-wrap;word-break:break-word;">${linkifyText(msg.texto)}</div></div></div>`;
      }).join('');
      chatList.scrollTop = chatList.scrollHeight;
    }
    renderChat();
    const chatInput = overlay.querySelector('#f_chat_input');
    const send = ()=>{
      const texto = chatInput.value.trim();
      if(!texto) return;
      const autorId = me ? me.id : null;
      t.chat.push({id:uid(), autorId, autorNome: me ? me.nome : (session?session.nome:'—'), texto, criadoEm:new Date().toISOString()});
      chatInput.value = '';
      if(autorId && autorId===t.responsavelId && t.solicitanteId && t.solicitanteId!==autorId){
        setPendente(t, t.solicitanteId);
        apiNotify('duvida_tarefa', membroById(t.solicitanteId), t.titulo);
      } else if(autorId && autorId===t.solicitanteId && t.responsavelId && t.responsavelId!==autorId){
        setPendente(t, t.responsavelId);
        apiNotify('duvida_respondida', membroById(t.responsavelId), t.titulo);
      }
      renderChat(); scheduleSave(); render();
    };
    overlay.querySelector('#f_chat_send').onclick = send;
    chatInput.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } };
  }

  let curStatus = t.status;
  overlay.querySelectorAll('#f_status button').forEach(b=>b.onclick=()=>{
    curStatus = b.dataset.s;
    overlay.querySelectorAll('#f_status button').forEach(x=>x.classList.toggle('active', x===b));
  });

  if(!isNew){
    overlay.querySelector('#f_del').onclick = ()=>{
      if(!confirm('Excluir esta tarefa?')) return;
      state.tarefas = state.tarefas.filter(x=>x.id!==t.id);
      scheduleSave(); overlay.remove(); render(); toast('Tarefa excluída.');
    };
  }

  overlay.querySelector('#f_save').onclick = ()=>{
    const titulo = overlay.querySelector('#f_titulo').value.trim();
    const tipoVal = overlay.querySelector('#f_tipo').value;
    const prazo = overlay.querySelector('#f_prazo').value;
    // Solicitante: na criação é sempre o usuário logado; na edição, mantém o original. Não vem da tela.
    const solicVal = isNew ? (me ? me.id : '') : t.solicitanteId;
    const respVal = overlay.querySelector('#f_resp').value;
    const faltando = [];
    if(!titulo) faltando.push('Título');
    if(!tipoVal) faltando.push('Tipo');
    if(!prazo) faltando.push('Prazo');
    if(!instSel.value) faltando.push('Instituição');
    if(!solicVal && isNew) faltando.push('Solicitado por (usuário logado não identificado — saia e entre de novo)');
    if(!respVal) faltando.push('Responsável');
    if(faltando.length){ toast('Preencha: ' + faltando.join(', ')); return; }

    Object.assign(t, {titulo, tipo:tipoVal, prazo, instituicaoId:instSel.value, projetoId:projSel.value,
      solicitanteId:solicVal, responsavelId:respVal, descricao: overlay.querySelector('#f_desc').value});
    t.checklist = draftChecklist.map(i=>({...i}));
    if(isNew) t.criadoEm = new Date().toISOString();
    if(curStatus==='concluido' && originalStatus!=='concluido') t.concluidoEm = new Date().toISOString();
    else if(curStatus!=='concluido' && originalStatus==='concluido') t.concluidoEm = null;
    t.status = curStatus;
    if(isNew || t.responsavelId !== originalResponsavelId) setPendente(t, t.responsavelId);
    if(recCheckbox.checked){
      const tipo = recTipoSel.value;
      t.recorrencia = tipo==='dias' ? {tipo, valor: parseInt(overlay.querySelector('#f_rec_dias').value)||1} : {tipo};
    } else t.recorrencia = null;

    if(isNew) state.tarefas.push(t);
    maybeGenerateNextRecurrence(t, originalStatus, curStatus);
    if(isNew){
      filters = {inst:'',proj:'',resp:'',status:'',tipo:'',busca:''};
      apiNotify('tarefa_nova', membroById(t.responsavelId), t.titulo);
    } else if(t.responsavelId !== originalResponsavelId){
      apiNotify('tarefa_nova', membroById(t.responsavelId), t.titulo);
    }
    scheduleSave(); overlay.remove(); render();
    toast(isNew?'Tarefa criada.':'Tarefa atualizada.');
  };
}

// Cadastro rápido de uma nova opção numa lista (Tipo de tarefa, Origem do projeto...).
// Ignora duplicados que só diferem em maiúsculas/minúsculas ou espaços: nesse caso usa a opção já existente.
function openQuickOptionModal(cfg){
  const overlay = makeModal(cfg.titulo, `
    <div class="field"><label>${cfg.label}</label><input id="qt_nome" placeholder="${escapeAttr(cfg.placeholder||'')}"></div>
    <div id="qt_msg" class="hint" style="margin:-6px 0 0;display:none;"></div>
    <div class="modal-actions" style="justify-content:flex-end;"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="qt_save">Adicionar</button></div>`, 340);
  overlay.style.zIndex = '300';
  const inp = overlay.querySelector('#qt_nome');
  inp.focus();
  const save = ()=>{
    const nome = inp.value.trim().replace(/\s+/g,' ');
    if(!nome) return;
    const lista = cfg.lista();
    const existente = lista.find(x=>normalizeStr(x)===normalizeStr(nome));
    if(existente){
      overlay.remove(); cfg.onAdded(existente); toast(`"${existente}" já existe — selecionada.`);
      return;
    }
    lista.push(nome); scheduleSave();
    overlay.remove(); cfg.onAdded(nome); toast(cfg.okMsg);
  };
  overlay.querySelector('#qt_save').onclick = save;
  inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); save(); } };
}

    <div class="field"><label style="display:flex;align-items:center;gap:7px;text-transform:none;font-size:13px;color:var(--ink);letter-spacing:0;">

    <div class="modal-actions" style="justify-content:flex-end;"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="ns_save">Adicionar</button></div>`, 380);
  overlay.style.zIndex = '300';

    lista:()=>state.origensProjeto, onAdded, okMsg:'Origem adicionada.'});

function maybeGenerateNextRecurrence(t, prevStatus, newStatus){
  if(!(newStatus==='concluido' && prevStatus!=='concluido' && t.recorrencia && t.prazo)) return;
  const proximoPrazo = nextDateForRecurrence(t.prazo, t.recorrencia);
  if(!proximoPrazo) return;
  const agora = new Date().toISOString();
  const nova = {
    id: uid(), titulo: t.titulo, tipo: t.tipo, instituicaoId: t.instituicaoId, projetoId: t.projetoId,
    solicitanteId: t.solicitanteId, responsavelId: t.responsavelId, prazo: proximoPrazo, status: 'afazer',
    descricao: t.descricao, recorrencia: t.recorrencia,
    pendenteLeituraPara: t.responsavelId || null, ultimaLeituraPor: null, ultimaLeituraEm: null, chat: [],
    criadoEm: agora, pendenteDesde: t.responsavelId ? agora : null, concluidoEm: null,
    naoLidoPara: t.responsavelId || null, checklist: t.checklist.map(i=>({id:uid(), texto:i.texto, feito:false}))
  };
  state.tarefas.push(nova);
  apiNotify('tarefa_nova', membroById(nova.responsavelId), nova.titulo);
}

function bulkSetStatus(newStatus){
  selectedTaskIds.forEach(id=>{
    const t = state.tarefas.find(x=>x.id===id);
    if(!t) return;
    const prev = t.status;
    if(newStatus==='concluido' && prev!=='concluido') t.concluidoEm = new Date().toISOString();
    else if(newStatus!=='concluido' && prev==='concluido') t.concluidoEm = null;
    t.status = newStatus;
    maybeGenerateNextRecurrence(t, prev, newStatus);
  });
  selectedTaskIds.clear();
  scheduleSave(); render(); toast('Status atualizado em massa.');
}
function bulkDeleteTasks(){
  if(!confirm(`Excluir ${selectedTaskIds.size} tarefa(s) selecionada(s)? Essa ação não pode ser desfeita.`)) return;
  state.tarefas = state.tarefas.filter(t=>!selectedTaskIds.has(t.id));
  selectedTaskIds.clear();
  scheduleSave(); render(); toast('Tarefas excluídas.');
}
function nextDateForRecurrence(dateStr, rec){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  switch(rec.tipo){
    case 'dias': d.setDate(d.getDate() + (parseInt(rec.valor)||1)); break;
    case 'semanal': d.setDate(d.getDate()+7); break;
    case 'quinzenal': d.setDate(d.getDate()+15); break;
    case 'mensal': d.setMonth(d.getMonth()+1); break;
    case 'bimestral': d.setMonth(d.getMonth()+2); break;
    case 'semestral': d.setMonth(d.getMonth()+6); break;
    default: return null;
  }
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}

/* ================== PROJETOS ================== */
function renderProjetos(c){
  if(state.instituicoes.length===0){
    c.innerHTML = `<div class="empty-state"><div class="big">Nenhuma instituição cadastrada</div><div>Cadastre as instituições primeiro (aba "Instituições") — cada projeto pertence a uma instituição.</div></div>`;
    return;
  }
  const f = projFilters;
  const filterBar = document.createElement('div');
  filterBar.className = 'filters';
  filterBar.innerHTML = `
    <input type="text" id="pBusca" placeholder="🔎 Buscar projeto ou código..." value="${escapeAttr(f.busca)}">
    <select id="pInst"><option value="">Todas instituições</option>${state.instituicoes.map(i=>`<option value="${i.id}" ${f.inst===i.id?'selected':''}>${escapeHtml(instLabel(i))}</option>`).join('')}</select>
    <select id="pOrigem"><option value="">Todas origens</option>${state.origensProjeto.map(o=>`<option ${f.origem===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>
    <label class="chk"><input type="checkbox" id="pFin" ${f.finalizados?'checked':''}> mostrar finalizados</label>
    <div class="spacer"></div>
    ${(f.inst||f.origem||f.busca||f.status) ? `<button class="chip-clear" id="pClear">limpar filtros</button>` : ''}
  `;
  c.appendChild(filterBar);
  const pb = filterBar.querySelector('#pBusca');
  pb.oninput = e=>{ f.busca = e.target.value; const pos = e.target.selectionStart; render(); requestAnimationFrame(()=>{ const n=document.getElementById('pBusca'); if(n){ n.focus(); n.setSelectionRange(pos,pos);} }); };
  filterBar.querySelector('#pInst').onchange = e=>{ f.inst = e.target.value; render(); };
  filterBar.querySelector('#pOrigem').onchange = e=>{ f.origem = e.target.value; render(); };
  filterBar.querySelector('#pFin').onchange = e=>{ f.finalizados = e.target.checked; render(); };
  const pc = filterBar.querySelector('#pClear');
  if(pc) pc.onclick = ()=>{ projFilters = {inst:'', status:'', origem:'', busca:'', finalizados:false}; render(); };

  // base (sem o filtro de status) — usada para as contagens dos chips
  const base = allProjects().filter(({inst,p})=>{
    if(f.inst && inst.id!==f.inst) return false;
    if(f.origem && p.origem!==f.origem) return false;
    if(f.busca){ const q = normalizeStr(f.busca); if(!normalizeStr(p.nome).includes(q) && !normalizeStr(p.codigo).includes(q)) return false; }
    return true;
  });
  const chips = document.createElement('div');
  chips.className = 'chips';
  const nAcomp = base.filter(x=>statusById(x.p.status).acomp).length;
  chips.innerHTML = `
    <button class="chip ${!f.status?'active':''}" data-st="">Todos<span class="n">${base.filter(x=>f.finalizados||x.p.status!=='finalizado').length}</span></button>
    <button class="chip acomp ${f.status==='acomp'?'active':''}" data-st="acomp" title="Em tramitação ou em alteração de plano">⚑ Em acompanhamento<span class="n">${nAcomp}</span></button>
    ${allProjStatus().map(s=>`<button class="chip ${f.status===s.id?'active':''}" data-st="${s.id}">${escapeHtml(s.curto)}<span class="n">${base.filter(x=>x.p.status===s.id).length}</span></button>`).join('')}
  `;
  chips.querySelectorAll('.chip').forEach(b=>b.onclick = ()=>{ f.status = b.dataset.st; render(); });
  c.appendChild(chips);

  const order = id=>allProjStatus().findIndex(s=>s.id===id);
  const list = base.filter(({p})=>{
    if(f.status==='acomp') return statusById(p.status).acomp;
    if(f.status) return p.status===f.status;
    return f.finalizados || p.status!=='finalizado';
  }).sort((a,b)=> instLabel(a.inst).localeCompare(instLabel(b.inst)) || order(a.p.status)-order(b.p.status) || a.p.nome.localeCompare(b.p.nome));

  if(list.length===0){
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.innerHTML = allProjects().length===0
      ? `<div class="big">Nenhum projeto cadastrado</div><div>Use "+ Novo projeto" para cadastrar o primeiro.</div>`
      : `<div>Nenhum projeto com esses filtros.</div>`;
    c.appendChild(e);
    return;
  }

  const wrap = document.createElement('div');
  wrap.className = 'tbl-wrap';
  wrap.innerHTML = `
    <table class="tbl" style="min-width:980px;">
      <thead><tr><th>Instituição</th><th>Projeto</th><th>Código</th><th>Origem</th><th>Vigência</th><th>Status</th><th>Desde</th></tr></thead>
      <tbody>${list.map(({inst,p})=>{
        const dFim = p.fim ? daysUntil(p.fim) : null;
        let fimNote = '';
        if(p.status!=='finalizado' && dFim!==null){
          if(dFim<0) fimNote = `<div class="small" style="color:var(--bad);">vigência encerrada</div>`;
          else if(dFim<=60) fimNote = `<div class="small" style="color:#8a6420;">termina em ${dFim}d</div>`;
        }
        const alt = (p.status==='alteracao'||p.status==='alteracao_aprovada') && p.alteracaoTipos.length
          ? `<div class="small muted" style="margin-top:3px;">${p.alteracaoTipos.map(escapeHtml).join(' · ')}</div>` : '';
        return `<tr class="click" data-inst="${inst.id}" data-proj="${p.id}">
          <td><span style="display:inline-flex;align-items:center;gap:7px;"><span class="inst-swatch" style="background:${inst.cor}"></span><span title="${escapeAttr(inst.nome)}">${escapeHtml(instLabel(inst))}</span></span></td>
          <td style="font-weight:600;">${escapeHtml(p.nome)}${p.registros.length?`<div class="small muted" style="font-weight:400;" title="Registros no Histórico do Projeto">📝 ${p.registros.length} registro${p.registros.length>1?'s':''} · último ${fmtDate(p.registros[p.registros.length-1].criadoEm)}</div>`:''}</td>
          <td class="mono">${escapeHtml(p.codigo)||'<span class="muted">—</span>'}</td>
          <td>${escapeHtml(p.origem)||'<span class="muted">—</span>'}</td>
          <td class="mono small">${fmtDate(p.inicio)} → ${fmtDate(p.fim)}${fimNote}</td>
          <td>${projBadge(p)}${alt}</td>
          <td class="mono small muted">${p.statusDesde?fmtDate(p.statusDesde):'—'}</td>
        </tr>`;
      }).join('')}</tbody>
    </table>`;
  wrap.querySelectorAll('tbody tr').forEach(tr=>tr.onclick = ()=>openProjModal(tr.dataset.inst, tr.dataset.proj));
  c.appendChild(wrap);
}

function openProjModal(instId, projId){
  if(state.instituicoes.length===0){ toast('Cadastre uma instituição primeiro.'); return; }
  const isNew = !projId;
  const inst0 = instById(instId) || state.instituicoes[0];
  const orig = isNew ? null : projById(inst0.id, projId);
  if(!isNew && !orig) return;
  const p = isNew
    ? {id:uid(), nome:'', codigo:'', origem:'', inicio:'', fim:'', status:'proposta', statusDesde:'', historico:[], alteracaoTipos:[], obs:'', registros:[]}
    : JSON.parse(JSON.stringify(orig));
  const me = currentMembro();

  const overlay = makeModal(isNew?'Novo projeto':'Editar projeto', `
    <div class="field"><label>Instituição</label>
      <select id="p_inst">${state.instituicoes.map(i=>`<option value="${i.id}" ${inst0.id===i.id?'selected':''}>${escapeHtml(instLabel(i))}</option>`).join('')}</select></div>
    <div class="field"><label>Nome do projeto</label><input id="p_nome" value="${escapeAttr(p.nome)}" placeholder="Ex.: Arte em Movimento"></div>
    <div class="field-row">
      <div class="field"><label>Número / código</label><input id="p_codigo" value="${escapeAttr(p.codigo)}" placeholder="Ex.: 123/2026"></div>
      <div class="field"><label>Origem do projeto</label>
        <div style="display:flex;gap:6px;">
          <select id="p_origem" style="flex:1;min-width:0;"></select>
          <button type="button" class="btn ghost small" id="p_origem_add" title="Cadastrar nova origem" style="flex:none;padding:0 12px;">+</button>
        </div></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Início da vigência</label><input id="p_inicio" type="date" value="${p.inicio}"></div>
      <div class="field"><label>Fim da vigência</label><input id="p_fim" type="date" value="${p.fim}"></div>
    </div>

    <div class="modal-sub">Situação do projeto</div>
    <div class="field-row">
      <div class="field"><label>Status</label>
        <div style="display:flex;gap:6px;">
          <select id="p_status" style="flex:1;min-width:0;"></select>
          <button type="button" class="btn ghost small" id="p_status_add" title="Cadastrar novo status" style="flex:none;padding:0 12px;">+</button>
        </div></div>
      <div class="field"><label>Nesse status desde</label><input id="p_desde" type="date" value="${p.statusDesde||todayStr()}"></div>
    </div>
    <div class="hint" id="p_status_hint" style="margin:-6px 0 0;"></div>
    <div class="field" id="p_alt_wrap"><label>Tipo de alteração</label>
      <div class="check-grid">${ALT_TIPOS.map(a=>`<label><input type="checkbox" class="p_alt" value="${escapeAttr(a)}" ${p.alteracaoTipos.includes(a)?'checked':''}> ${escapeHtml(a)}</label>`).join('')}</div></div>
    <div class="field"><label>Observações</label><textarea id="p_obs" placeholder="Ex.: diligência respondida em 10/10, aguardando parecer...">${escapeHtml(p.obs)}</textarea></div>

    <div class="modal-sub">Histórico do Projeto</div>
    <div class="hint" style="margin:-6px 0 0;">Linha do tempo de acontecimentos, decisões e alterações. Cada registro fica salvo com seu nome, data e horário, e não pode ser apagado.</div>
    <div class="field">
      <div style="display:flex;gap:8px;align-items:flex-end;">
        <textarea id="p_reg_input" rows="2" placeholder="Escreva um novo registro... (Enter registra · Shift+Enter quebra linha)" style="flex:1;min-height:0;"></textarea>
        <button type="button" class="btn small" id="p_reg_send" style="flex:none;">Registrar</button>
      </div>
      <div id="p_reg_list" style="margin-top:10px;max-height:260px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--white);display:flex;flex-direction:column;gap:8px;"></div>
    </div>

    ${p.historico.length ? `<div class="field"><label>Histórico de status</label><div class="hist">
      ${[...p.historico].reverse().map(h=>`<div><span class="mono muted" style="min-width:78px;">${fmtDate(h.data)}</span>${(()=>{const s=statusById(h.status);return `<span class="badge ${s.cls}">${escapeHtml(s.curto)}</span>`;})()}<span class="muted">${h.por?'por '+escapeHtml(h.por):''}</span></div>`).join('')}
    </div></div>` : ''}

    <div class="modal-actions">
      <div>${!isNew?`<button class="btn danger small" id="p_del">Excluir</button>`:''}</div>
      <div style="display:flex;gap:8px;"><button class="btn ghost" data-close>Cancelar</button><button class="btn" id="p_save">${isNew?'Cadastrar projeto':'Salvar'}</button></div>
    </div>`);

  // ---- Histórico do Projeto ----
  const regList = overlay.querySelector('#p_reg_list'), regInput = overlay.querySelector('#p_reg_input');
  function renderRegistros(){
    if(!p.registros.length){ regList.innerHTML = `<div class="hint" style="margin:0;">Nenhum registro ainda.</div>`; return; }
    regList.innerHTML = p.registros.map(r=>{
      const autor = r.autorId ? membroById(r.autorId) : null;
      const dt = new Date(r.criadoEm);
      const quando = isNaN(dt) ? '—' : `${dt.toLocaleDateString('pt-BR')} às ${pad2(dt.getHours())}h${pad2(dt.getMinutes())}`;
      return `<div style="background:var(--paper-dim);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:flex-start;">
        <span class="avatar" style="background:${autor?membroColor(autor):'var(--ink)'};color:#2b2f38;">${initials(r.autorNome||'—')}</span>
        <div style="min-width:0;"><div style="font-size:11.5px;font-weight:700;">${escapeHtml(r.autorNome||'—')} <span style="font-weight:400;color:var(--muted);">— ${quando}</span></div>
        <div style="font-size:13px;margin-top:2px;white-space:pre-wrap;word-break:break-word;">${linkifyText(r.texto)}</div></div></div>`;
    }).join('');
    regList.scrollTop = regList.scrollHeight;
  }
  renderRegistros();
  const registrar = ()=>{
    const texto = regInput.value.trim();
    if(!texto) return;
    const reg = {id:uid(), autorId: me?me.id:null, autorNome: me ? me.nome : (session?session.nome:'—'), texto, criadoEm:new Date().toISOString()};
    p.registros.push(reg);
    // Projeto já existente: o registro é gravado na hora, mesmo que a janela seja fechada sem "Salvar".
    if(!isNew){ orig.registros = orig.registros || []; orig.registros.push({...reg}); scheduleSave(); }
    regInput.value = '';
    renderRegistros();
    if(!isNew) render();
    toast(isNew ? 'Registro incluído — será salvo ao cadastrar o projeto.' : 'Registro salvo no histórico.');
  };
  overlay.querySelector('#p_reg_send').onclick = registrar;
  regInput.onkeydown = e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); registrar(); } };

  const origemSel = overlay.querySelector('#p_origem');
  const fillOrigem = sel=>{
    const opts = [...state.origensProjeto];
    if(sel && !opts.includes(sel)) opts.push(sel); // preserva origem antiga que não está mais na lista
    origemSel.innerHTML = `<option value="">—</option>` + opts.map(o=>`<option ${o===sel?'selected':''}>${escapeHtml(o)}</option>`).join('');
  };
  fillOrigem(p.origem);
  overlay.querySelector('#p_origem_add').onclick = ()=>openQuickOrigemModal(nome=>fillOrigem(nome));

  const stSel = overlay.querySelector('#p_status'), desde = overlay.querySelector('#p_desde');
  const fillStatus = sel=>{
    stSel.innerHTML = allProjStatus().map(s=>`<option value="${s.id}" ${sel===s.id?'selected':''}>${escapeHtml(s.label)}</option>`).join('');
  };
  fillStatus(p.status);
  overlay.querySelector('#p_status_add').onclick = ()=>openNovoStatusModal(id=>{ fillStatus(id); syncStatusUI(); });
  const altWrap = overlay.querySelector('#p_alt_wrap'), hint = overlay.querySelector('#p_status_hint');
  function syncStatusUI(){
    const s = stSel.value;
    altWrap.style.display = (s==='alteracao' || s==='alteracao_aprovada') ? 'block' : 'none';
    hint.textContent = statusById(s).acomp ? '⚑ Este status entra em "Projetos em acompanhamento" no topo — acompanhe diligências e prazos.' : '';
    if(!isNew && s!==orig.status && desde.value===(orig.statusDesde||'')) desde.value = todayStr();
  }
  stSel.onchange = syncStatusUI;
  syncStatusUI();

  if(!isNew){
    overlay.querySelector('#p_del').onclick = ()=>{
      const nTar = state.tarefas.filter(t=>t.projetoId===p.id).length;
      const nLink = state.links.filter(l=>l.projetoId===p.id).length;
      const extra = (nTar||nLink) ? `\n\n${nTar} tarefa(s) e ${nLink} link(s) ligados a ele passam para "Geral da instituição".` : '';
      if(!confirm(`Excluir o projeto "${p.nome}"?${extra}`)) return;
      const inst = instById(inst0.id);
      inst.projetos = inst.projetos.filter(x=>x.id!==p.id);
      state.tarefas.forEach(t=>{ if(t.projetoId===p.id) t.projetoId=''; });
      state.links.forEach(l=>{ if(l.projetoId===p.id) l.projetoId=''; });
      scheduleSave(); overlay.remove(); render(); toast('Projeto excluído.');
    };
  }

  overlay.querySelector('#p_save').onclick = ()=>{
    const nome = overlay.querySelector('#p_nome').value.trim();
    if(!nome){ toast('Informe o nome do projeto.'); return; }
    const inicio = overlay.querySelector('#p_inicio').value, fim = overlay.querySelector('#p_fim').value;
    if(inicio && fim && fim < inicio){ toast('O fim da vigência está antes do início.'); return; }
    const novoStatus = stSel.value;
    const novoDesde = desde.value || todayStr();
    p.nome = nome;
    p.codigo = overlay.querySelector('#p_codigo').value.trim();
    p.origem = overlay.querySelector('#p_origem').value;
    p.inicio = inicio; p.fim = fim;
    p.obs = overlay.querySelector('#p_obs').value;
    p.alteracaoTipos = (novoStatus==='alteracao'||novoStatus==='alteracao_aprovada')
      ? [...overlay.querySelectorAll('.p_alt:checked')].map(x=>x.value) : p.alteracaoTipos;
    if(isNew || novoStatus!==p.status){
      p.historico.push({status:novoStatus, data:novoDesde, por: me?me.nome:(session?session.nome:'')});
    } else if(novoDesde!==p.statusDesde && p.historico.length){
      p.historico[p.historico.length-1].data = novoDesde; // corrigindo a data do status atual
    }
    p.status = novoStatus; p.statusDesde = novoDesde;

    const newInstId = overlay.querySelector('#p_inst').value;
    const oldInst = instById(inst0.id), newInst = instById(newInstId);
    if(isNew){
      newInst.projetos.push(p);
    } else {
      const idx = oldInst.projetos.findIndex(x=>x.id===p.id);
      if(newInstId===oldInst.id){ oldInst.projetos[idx] = p; }
      else {
        oldInst.projetos.splice(idx,1); newInst.projetos.push(p);
        state.tarefas.forEach(t=>{ if(t.projetoId===p.id) t.instituicaoId = newInstId; });
        state.links.forEach(l=>{ if(l.projetoId===p.id) l.instituicaoId = newInstId; });
      }
    }
    scheduleSave(); overlay.remove(); render();
    toast(isNew?'Projeto cadastrado.':'Projeto atualizado.');
  };
}

/* ================== INSTITUIÇÕES ================== */
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];

// ---- máscaras ----
const onlyDigits = s=>String(s||'').replace(/\D/g,'');
function maskCPF(v){
  const d = onlyDigits(v).slice(0,11);
  return d.replace(/^(\d{3})(\d)/,'$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d{1,2})$/,'.$1-$2');
}
function maskCNPJ(v){
  const d = onlyDigits(v).slice(0,14);
  return d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3')
          .replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2');
}
function maskPhone(v){
  const d = onlyDigits(v).slice(0,11);
  if(d.length <= 2) return d.length ? '(' + d : '';
  if(d.length <= 6) return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if(d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
}
function maskCEP(v){ const d = onlyDigits(v).slice(0,8); return d.length > 5 ? d.slice(0,5) + '-' + d.slice(5) : d; }
// RG varia por estado: aplica o formato padrão (00.000.000-0) só quando tem 8 ou 9 caracteres;
// fora disso mantém o que foi digitado (letras, números e dígito X).
function maskRG(v){
  const raw = String(v||'').toUpperCase();
  const c = raw.replace(/[^0-9X]/g,'');
  if(/^\d{7}[\dX]$/.test(c)) return `${c.slice(0,1)}.${c.slice(1,4)}.${c.slice(4,7)}-${c.slice(7)}`;
  if(/^\d{8}[\dX]$/.test(c)) return `${c.slice(0,2)}.${c.slice(2,5)}.${c.slice(5,8)}-${c.slice(8)}`;
  return raw.replace(/[^0-9A-Z.\-\/ ]/g,'').slice(0,20);
}
function bindMask(el, fn, liveFn){
  if(!el) return;
  if(liveFn) el.addEventListener('input', ()=>{ el.value = liveFn(el.value); });
  el.addEventListener('blur', ()=>{ el.value = fn(el.value); });
}

function formatEnd(e){
  if(!e) return '';
  const l1 = [e.logradouro, e.numero].filter(Boolean).join(', ');
  const l2 = [l1, e.complemento].filter(Boolean).join(' — ');
  const cidadeUf = [e.cidade, e.uf].filter(Boolean).join('/');
  const partes = [l2, e.bairro, cidadeUf, e.cep ? 'CEP ' + e.cep : ''].filter(Boolean);
  return partes.join(' · ');
}

    `RG: ${v(r.rg)}`,
    `Profissão: ${v(r.profissao)}`,
    `Endereço: ${v(formatEnd(r.end))}`,
    `E-mail: ${v(r.email)}`,
    `Telefone: ${v(r.telefone)}`,
    ``,

function openInstModal(instId){
  const isNew = !instId;
  const orig = isNew ? null : instById(instId);
  const i = isNew
    ? (()=>{ const n = {id:uid(), nome:'', cor: PALETTE[state.instituicoes.length % PALETTE.length], excluirIndicadores:false, projetos:[]}; normalizeInst(n, state.instituicoes.length); n.nome=''; return n; })()
    : orig;
  const r = i.rep, ct = i.contador;
  let cor = i.cor;
  const overlay = makeModal(isNew?'Nova instituição':'Editar instituição', `
    <div class="form-cols">
      <div class="form-col">

        <div class="field"><label>Nome completo da instituição</label><input id="i_nome" value="${escapeAttr(i.nome)}"></div>

        <h3>Contador</h3>

          <div class="field"><label>CRC (UF)</label><select id="c_crcuf"><option value="">—</option>${UFS.map(u=>`<option ${ct.crcUf===u?'selected':''}>${u}</option>`).join('')}</select></div>
